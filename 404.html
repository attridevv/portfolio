<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Dev Attri</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark}
body{background:#0a0b0d;color:#ececec;font-family:'Inter',system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
.code{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#80858e}
h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.04em;font-weight:600;margin:14px 0 12px}
p{color:#b4b8bf;margin-bottom:32px}
a{display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:999px;background:#ececec;color:#0a0b0d;font-weight:600;text-decoration:none;font-size:.95rem}
a:hover{background:#fff}
a:focus-visible{outline:2px solid #70f2c4;outline-offset:3px}
</style>
</head>
<body>
<div>
  <p class="code">404 · not found</p>

</div>
