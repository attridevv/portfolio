<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Case Study — Dev Attri</title>
<meta name="description" content="Case study page.">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--white:#e2e8f0;--blue:#93c5fd;--pill:rgba(147,197,253,.08)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 50% 30%,rgba(37,99,235,.04),transparent 60%),linear-gradient(180deg,#020810,#041020,#020810);color:var(--white);min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased}
#hire-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:2.75rem 1.1rem 3rem}
.kicker{font-size:.38rem;letter-spacing:.25em;text-transform:uppercase;opacity:.25;margin-bottom:.4rem}
.back{display:inline-block;font-size:.4rem;letter-spacing:.08em;text-decoration:none;color:rgba(147,197,253,.4);border:1px solid var(--pill);padding:.25rem .6rem;border-radius:20px;margin-bottom:1.6rem;transition:all .25s}
.back:hover{color:var(--blue);border-color:rgba(147,197,253,.25)}
h1{font-size:1.5rem;font-weight:900;letter-spacing:.08em;margin-bottom:.5rem}
p{font-size:.47rem;line-height:1.7;opacity:.55;margin-bottom:.6rem}
</style>
</head>
<body>
<canvas id="hire-bg" aria-hidden="true"></canvas>

<div class="wrap">
  <a class="back" href="/hire/">← ALL WORK</a>
  <!-- PLACEHOLDER_PROJECT: replace title, kicker number, and copy -->
  <header>
    <div class="kicker">Selected Work · 03</div><!-- // REVIEW -->
    <h1>Project Three</h1><!-- // REVIEW -->
  </header>
  <p>Case study to be added.</p><!-- // REVIEW -->
</div>

<script>
(function(){var c=document.getElementById('hire-bg'),ctx=c.getContext('2d'),w,h;
function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}R();window.addEventListener('resize',R);
var p=[];for(var i=0;i<35;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:-.2-Math.random()*.5,r:Math.random()*1.2+.3,o:Math.random()*.2+.08,l:Math.random()*300});
(function D(){if(w!==c.width||h!==c.height)R();ctx.clearRect(0,0,w,h);
p.forEach(function(pp){pp.x+=pp.vx;pp.y+=pp.vy;pp.l--;if(pp.y<-10||pp.l<=0){pp.x=Math.random()*w;pp.y=h+10;pp.l=300+Math.random()*200}ctx.beginPath();ctx.arc(pp.x,pp.y,pp.r,0,Math.PI*2);ctx.fillStyle='rgba(59,130,246,'+(pp.o*(pp.l/300))+')';ctx.fill()});requestAnimationFrame(D)})();})();
</script>
</body>
</html>
