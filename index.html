<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');

body{
  font-family:'Inter',-apple-system,sans-serif;
  width:100vw;height:100vh;overflow:hidden;display:flex;
  background:#000;
}

.world{flex:1;position:relative;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit}
.world:active{transform:scale(.98)}

canvas.world-canvas{position:absolute;inset:0;z-index:1}

/* ===== LEFT — SAKURA REALM ===== */
.world-l{
  background:linear-gradient(to bottom,#0d0515,#1a0618,#0d0515);
}
/* Radial warmth */
.world-l::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%,rgba(236,72,153,.15),transparent 60%),
    radial-gradient(ellipse at 80% 30%,rgba(251,191,36,.06),transparent 50%);
}

/* ===== RIGHT — VOID REALM ===== */
.world-r{
  background:linear-gradient(to bottom,#010108,#020210,#010108);
}
.world-r::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,rgba(88,28,135,.12),transparent 55%),
    radial-gradient(ellipse at 30% 70%,rgba(30,64,175,.04),transparent 50%);
}

/* ===== CONTENT OVERLAY ===== */
.content{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.inner{text-align:center;transition:all .6s cubic-bezier(.16,1,.3,1)}
.world:hover .inner{transform:translateY(-12px)}

.japanese{
  display:block;font-size:2.5rem;margin-bottom:.5rem;opacity:.15;transition:all .5s;
  letter-spacing:.1em;
}
.world:hover .japanese{opacity:.25;transform:scale(1.05)}
.world-l .japanese{color:#f9a8d4}.world-r .japanese{color:#c084fc}

.realm-title{
  display:block;font-size:2.8rem;font-weight:900;letter-spacing:.02em;margin-bottom:.3rem;
  transition:all .5s;
}
.world-l .realm-title{color:#fce7f3}.world-r .realm-title{color:#e9d5ff}
.world:hover .realm-title{transform:scale(1.04)}

.realm-sub{
  display:block;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  opacity:.3;transition:all .5s;
}
.world-l .realm-sub{color:#f9a8d4}.world-r .realm-sub{color:#c084fc}
.world:hover .realm-sub{opacity:.6;letter-spacing:.25em}

.realm-desc{
  display:block;font-size:.55rem;opacity:0;transform:translateY(8px);transition:all .5s;
  margin-top:.75rem;letter-spacing:.08em;
}
.world-l .realm-desc{color:rgba(252,231,243,.5)}.world-r .realm-desc{color:rgba(233,213,255,.5)}
.world:hover .realm-desc{opacity:1;transform:translateY(0)}

/* ===== CENTER ===== */
.center-line{
  position:fixed;top:5%;bottom:5%;left:50%;width:1px;z-index:30;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(168,85,247,.4),rgba(255,255,255,.15),rgba(168,85,247,.4),transparent);
  box-shadow:0 0 15px rgba(168,85,247,.3),0 0 30px rgba(139,92,246,.15);
  animation:linePulse 2.5s ease-in-out infinite;
}
@keyframes linePulse{0%,100%{opacity:.5}50%{opacity:1}}

.center-node{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;
  width:12px;height:12px;border-radius:50%;
  background:#c084fc;box-shadow:0 0 20px rgba(168,85,247,.8),0 0 60px rgba(139,92,246,.4);
  animation:nodePulse 3s ease-in-out infinite;
}
@keyframes nodePulse{0%,100%{transform:translate(-50%,-50%)scale(1);opacity:.7}50%{transform:translate(-50%,-50%)scale(1.8);opacity:.4}}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  body{flex-direction:column}
  .world{flex:none;height:50vh}
  .center-line{top:50%;left:5%;right:5%;bottom:auto;width:auto;height:1px}
  .center-node{top:50%}
  .realm-title{font-size:1.8rem}
  .japanese{font-size:1.6rem}
}
</style>
</head>
<body>

<!-- ===== LEFT — SAKURA ===== -->
<a href="/fire" class="world world-l">
  <canvas class="world-canvas" id="c-sakura"></canvas>
  <div class="content">
    <div class="inner">
      <span class="japanese">桜</span>
      <span class="realm-title">About</span>
      <span class="realm-sub">第一章 · The Self</span>
      <span class="realm-desc">Leo · Identity · Who I am</span>
    </div>
  </div>
</a>

<!-- ===== RIGHT — VOID ===== -->
<a href="/water" class="world world-r">
  <canvas class="world-canvas" id="c-void"></canvas>
  <div class="content">
    <div class="inner">
      <span class="japanese">雷</span>
      <span class="realm-title">Create</span>
      <span class="realm-sub">第二章 · The Work</span>
      <span class="realm-desc">Tools · Builds · What I make</span>
    </div>
  </div>
</a>

<div class="center-line"></div>
<div class="center-node"></div>

<script>
// ==================== SAKURA ENGINE ====================
(function(){
var c=document.getElementById('c-sakura'),ctx=c.getContext('2d'),w,h;
var petals=[],blooms=[],lights=[],branches=[];
var wind=0,targetWind=0,time=0;

function R(){w=c.width=c.parentElement.offsetWidth;h=c.height=c.parentElement.offsetHeight}
R();window.addEventListener('resize',function(){R();initStatic()});

function initStatic(){
  // Tree branches
  branches=[];
  var bx=w*.35,by=h*.55;
  branches.push({x:bx,y:by,angle:-1.4,len:w*.35,thick:14,children:[]});
  branches.push({x:bx,y:by,angle:-1.0,len:w*.28,thick:10,children:[]});
  branches.push({x:bx,y:by,angle:-.6,len:w*.22,thick:8,children:[]});
  branches.push({x:bx,y:by,angle:0,len:w*.15,thick:6,children:[]});

  // Bloom clusters on branches
  blooms=[];
  for(var i=0;i<60;i++){
    blooms.push({
      x:Math.random()*w*.7+w*.05,y:Math.random()*h*.55+h*.05,
      r:4+Math.random()*18,o:.06+Math.random()*.15,
      phase:Math.random()*Math.PI*2,speed:.002+Math.random()*.004
    });
  }

  // Floating petals (100+)
  petals=[];
  for(var i=0;i<120;i++){
    petals.push({
      x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.6,vy:.3+Math.random()*.8,
      r:2+Math.random()*3,rot:Math.random()*Math.PI*2,rspeed:(Math.random()-.5)*.03,
      o:.3+Math.random()*.5,phase:Math.random()*Math.PI*2,
      color:Math.random()>.3?0:1 // 0=pink, 1=white
    });
  }

  // Ambient lights
  lights=[];
  for(var i=0;i<40;i++){
    lights.push({
      x:Math.random()*w,y:Math.random()*h,
      vy:-.15-Math.random()*.35,r:.5+Math.random()*1.2,
      o:.08+Math.random()*.2,phase:Math.random()*Math.PI*2
    });
  }
}

function drawBranch(x,y,angle,len,thick){
  if(len<8||thick<1)return;
  ctx.beginPath();ctx.moveTo(x,y);
  var ex=x+Math.cos(angle)*len,ey=y+Math.sin(angle)*len;
  ctx.lineTo(ex,ey);
  ctx.strokeStyle='#1a0a18';ctx.lineWidth=thick;ctx.stroke();
  // Highlight
  ctx.strokeStyle='rgba(236,72,153,.08)';ctx.lineWidth=thick*.5;ctx.stroke();

  // Sub-branches
  var subAngle=angle+(Math.random()-.5)*.8;
  drawBranch(ex,ey,subAngle,len*.58,thick*.6);
  subAngle=angle+(Math.random()-.5)*.7;
  drawBranch(ex,ey,subAngle,len*.5,thick*.55);
}

function drawFrame(ts){
  time=ts;
  if(w!==c.parentElement.offsetWidth||h!==c.parentElement.offsetHeight)R();
  ctx.clearRect(0,0,w,h);

  // Wind
  targetWind=Math.sin(ts*.0003)*.3;
  wind+=(targetWind-wind)*.02;

  // Draw tree
  branches.forEach(function(b){drawBranch(b.x,b.y,b.angle+wind,b.len,b.thick)});

  // Blooms
  blooms.forEach(function(b){
    var pulse=.6+.4*Math.sin(ts*b.speed+b.phase);
    var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,'rgba(252,231,243,'+(b.o*pulse*1.3)+')');
    g.addColorStop(.4,'rgba(249,168,212,'+(b.o*pulse)+')');
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  });

  // Petals
  petals.forEach(function(p){
    p.x+=p.vx+wind*.8;p.y+=p.vy;p.rot+=p.rspeed;
    if(p.y>h+20){p.y=-20;p.x=Math.random()*w;p.rot=Math.random()*Math.PI*2}
    if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    var col=p.color===0?'rgba(249,168,212,'+p.o+')':'rgba(252,231,243,'+(p.o*.8)+')';
    ctx.fillStyle=col;ctx.beginPath();
    ctx.moveTo(0,0);ctx.bezierCurveTo(-p.r,-p.r*.2,-p.r*.3,-p.r*1.2,0,-p.r*1.5);
    ctx.bezierCurveTo(p.r*.3,-p.r*1.2,p.r,-p.r*.2,0,0);
    ctx.fill();ctx.restore();
  });

  // Ambient lights
  lights.forEach(function(l){
    l.y+=l.vy;if(l.y<-10){l.y=h+10;l.x=Math.random()*w}
    var b=.5+.5*Math.sin(ts*.002+l.phase);
    ctx.beginPath();ctx.arc(l.x,l.y,l.r,0,Math.PI*2);
    ctx.fillStyle='rgba(252,231,243,'+(l.o*b)+')';ctx.fill();
  });

  requestAnimationFrame(drawFrame);
}

initStatic();
requestAnimationFrame(drawFrame);
})();

// ==================== VOID LIGHTNING ENGINE ====================
(function(){
var c=document.getElementById('c-void'),ctx=c.getContext('2d'),w,h;
var bolts=[],stars=[],darkParticles=[],lastBolt=0;

function R(){w=c.width=c.parentElement.offsetWidth;h=c.height=c.parentElement.offsetHeight}
R();window.addEventListener('resize',function(){R();initStars()});

function initStars(){
  stars=[];
  for(var i=0;i<50;i++){
    stars.push({x:Math.random()*w,y:Math.random()*h,r:.2+Math.random()*.8,o:.05+Math.random()*.2,phase:Math.random()*Math.PI*2});
  }
  darkParticles=[];
  for(var i=0;i<30;i++){
    darkParticles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2-.1,r:.5+Math.random()*1.5,o:.04+Math.random()*.1,phase:Math.random()*Math.PI*2});
  }
}

function genBolt(){
  var x=w*.3+Math.random()*w*.4,y=h*.02;
  var pts=[{x:x,y:y}];
  var segments=8+Math.floor(Math.random()*6);
  for(var i=0;i<segments;i++){
    x+=(Math.random()-.5)*40;
    y+=h/(segments+1)+Math.random()*h*.04;
    pts.push({x:x,y:y});
    // Forks
    if(Math.random()<.3&&i>2){
      var fx=x,fy=y;
      var fork=[{x:fx,y:fy}];
      for(var j=0;j<5;j++){fx+=(Math.random()-.5)*30;fy+=h*.04+Math.random()*h*.03;fork.push({x:fx,y:fy})}
      pts[pts.length-1].fork=fork;
    }
    // Sub-forks
    if(Math.random()<.2&&i>4){
      var fx2=x,fy2=y;
      var fork2=[{x:fx2,y:fy2}];
      for(var k=0;k<3;k++){fx2+=(Math.random()-.5)*20;fy2+=h*.03;fork2.push({x:fx2,y:fy2})}
      pts[pts.length-1].fork2=fork2;
    }
  }
  return {pts:pts,life:35,alpha:.5+Math.random()*.5};
}

function drawPath(pts){
  ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++){
    if(pts[i].fork){ctx.lineTo(pts[i-1].x,pts[i-1].y);drawPath(pts[i].fork);ctx.moveTo(pts[i-1].x,pts[i-1].y)}
    else if(pts[i].fork2){ctx.lineTo(pts[i-1].x,pts[i-1].y);drawPath(pts[i].fork2);ctx.moveTo(pts[i-1].x,pts[i-1].y)}
    else ctx.lineTo(pts[i].x,pts[i].y);
  }
}

function drawBolt(bolt){
  if(bolt.life<=0)return;
  var a=bolt.alpha*(bolt.life/35);

  // Wide glow
  ctx.strokeStyle='rgba(139,92,246,'+(a*.25)+')';ctx.lineWidth=14;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor='rgba(139,92,246,'+(a*.4)+')';ctx.shadowBlur=30;
  ctx.beginPath();drawPath(bolt.pts);ctx.stroke();

  // Mid glow
  ctx.strokeStyle='rgba(168,85,247,'+(a*.4)+')';ctx.lineWidth=6;
  ctx.shadowColor='rgba(168,85,247,'+(a*.5)+')';ctx.shadowBlur=16;
  ctx.beginPath();drawPath(bolt.pts);ctx.stroke();

  // Purple core
  ctx.strokeStyle='rgba(192,132,252,'+(a*.55)+')';ctx.lineWidth=2.5;
  ctx.shadowColor='rgba(192,132,252,'+(a*.6)+')';ctx.shadowBlur=8;
  ctx.beginPath();drawPath(bolt.pts);ctx.stroke();

  // White hot
  ctx.strokeStyle='rgba(255,255,255,'+(a*.65)+')';ctx.lineWidth=.8;
  ctx.shadowColor='rgba(255,255,255,'+(a*.7)+')';ctx.shadowBlur=3;
  ctx.beginPath();drawPath(bolt.pts);ctx.stroke();

  ctx.shadowBlur=0;
}

function drawFrame(ts){
  if(w!==c.parentElement.offsetWidth||h!==c.parentElement.offsetHeight)R();
  ctx.clearRect(0,0,w,h);

  // Stars
  stars.forEach(function(s){
    var b=.5+.5*Math.sin(ts*.002+s.phase);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(196,181,253,'+(s.o*b)+')';ctx.fill();
  });

  // Dark particles
  darkParticles.forEach(function(d){
    d.x+=d.vx;d.y+=d.vy;
    if(d.x<0||d.x>w||d.y<0||d.y>h){d.x=Math.random()*w;d.y=Math.random()*h}
    var b=.5+.5*Math.sin(ts*.003+d.phase);
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle='rgba(139,92,246,'+(d.o*b)+')';ctx.fill();
  });

  // Lightning generation
  if(ts-lastBolt>1500+Math.random()*2500){
    bolts.push(genBolt());
    if(bolts.length>4)bolts.shift();
    lastBolt=ts;
  }
  bolts=bolts.filter(function(b){return b.life>0});
  bolts.forEach(function(b){b.life-=.6;drawBolt(b)});

  requestAnimationFrame(drawFrame);
}

initStars();
requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
