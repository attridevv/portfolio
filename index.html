<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}

.scene{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.dragon-container{position:relative;width:100%;height:100%}

/* ===== RED DRAGON (left) ===== */
.dragon-red{position:absolute;bottom:8%;left:8%;width:45%;height:65%}
.dragon-red .wing-blur{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(239,68,68,.08),transparent 60%);animation:redAura 3s ease-in-out infinite alternate}
@keyframes redAura{0%{opacity:.6}100%{opacity:1}}

/* ===== BLUE DRAGON (right) ===== */
.dragon-blue{position:absolute;bottom:8%;right:8%;width:45%;height:65%}
.dragon-blue .wing-blur{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%,rgba(59,130,246,.08),transparent 60%);animation:blueAura 3.5s ease-in-out infinite alternate}
@keyframes blueAura{0%{opacity:.6}100%{opacity:1}}

.dragon-svg{width:100%;height:100%;position:relative;z-index:2}

/* Fire breath particles */
.fire-particles{position:absolute;bottom:45%;left:52%;z-index:3}
.fp{position:absolute;width:4px;height:4px;background:#f97316;border-radius:50%;animation:fireRise var(--d) ease-out infinite;animation-delay:var(--del);opacity:0}
@keyframes fireRise{0%{opacity:1;transform:translate(0,0)scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0)}}

/* Ice breath particles */
.ice-particles{position:absolute;bottom:45%;right:52%;z-index:3}
.ip{position:absolute;width:3px;height:3px;background:#bae6fd;border-radius:1px;animation:iceBlow var(--d) ease-out infinite;animation-delay:var(--del);opacity:0}
@keyframes iceBlow{0%{opacity:1;transform:translate(0,0)scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0.3)}}

/* Lightning in sky */
.sky-lightning{position:absolute;top:0;left:0;right:0;height:45%;z-index:1}
.lightning-bolt{position:absolute;width:2px;background:linear-gradient(to bottom,transparent,#a855f7,#c084fc,#a855f7,transparent);border-radius:2px;animation:boltFlash var(--d) ease-in-out infinite;animation-delay:var(--del);opacity:0;transform-origin:top center}
@keyframes boltFlash{0%,90%,100%{opacity:0}45%{opacity:.9}48%{opacity:.2}50%{opacity:.8}52%{opacity:.3}}

.lightning-bolt::after{content:'';position:absolute;inset:-8px;background:inherit;filter:blur(15px);opacity:.5}

/* ===== OVERLAY ===== */
.overlay{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex}
.choice{flex:1;cursor:pointer;pointer-events:auto;position:relative;text-decoration:none;transition:background .5s}
.choice-l:hover{background:radial-gradient(ellipse at 20% 50%,rgba(239,68,68,.05),transparent 60%)}
.choice-r:hover{background:radial-gradient(ellipse at 80% 50%,rgba(59,130,246,.05),transparent 60%)}
.choice:hover .choice-hint{opacity:1;transform:translateX(-50%)translateY(-8px)}

.choice-hint{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:all .5s}
.choice-l .choice-hint{color:#fca5a5}.choice-r .choice-hint{color:#93c5fd}
.choice-hint .c1{display:block;font-size:.48rem;letter-spacing:.28em;text-transform:uppercase;font-weight:800;margin-bottom:.1rem}
.choice-hint .c2{display:block;font-size:.82rem;font-weight:900;letter-spacing:.08em}
.choice-hint .c3{display:block;font-size:.36rem;letter-spacing:.16em;margin-top:.1rem;opacity:.35}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="scene">
  <div class="dragon-container">

    <!-- SKY LIGHTNING -->
    <div class="sky-lightning" id="sky-bolts"></div>

    <!-- RED DRAGON -->
    <div class="dragon-red">
      <div class="wing-blur"></div>
      <svg class="dragon-svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMax meet">
        <defs>
          <radialGradient id="redGlow"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/><stop offset="100%" stop-color="transparent"/></radialGradient>

        </defs>
        
        <!-- Body glow -->
        <ellipse cx="220" cy="300" rx="180" ry="140" fill="url(#redGlow)"/>
        
        <!-- Body curve -->
        <path d="M80 380 Q120 350 180 320 Q240 290 280 310 Q320 330 350 350 Q380 370 420 360 L400 420 Q350 440 280 430 Q200 420 120 430 Z" fill="#1a0000" stroke="#7f1d1d" stroke-width="1.5"/>

        <!-- Neck -->

        <!-- Snout -->
        <path d="M195 185 Q220 180 230 185 Q225 192 195 192 Z" fill="#1a0000" stroke="#991b1b" stroke-width="1.2"/>

        <path d="M195 182 Q215 178 230 183" fill="none" stroke="#991b1b" stroke-width="1.5"/>
        <!-- Lower jaw -->
        <path d="M195 192 Q215 195 228 189" fill="none" stroke="#991b1b" stroke-width="1.2"/>
        <!-- Nostril -->
        <ellipse cx="225" cy="184" rx="2.5" ry="1.5" fill="#450a0a"/>
        <!-- Eye -->
        <ellipse cx="182" cy="180" rx="4" ry="3" fill="#fbbf24" stroke="#ef4444" stroke-width=".8"/>
        <ellipse cx="182" cy="180" rx="1.5" ry="2.5" fill="#000"/>

        <!-- Horns -->
        <path d="M165 172 Q155 145 140 135 Q150 155 162 170" fill="#991b1b" stroke="#7f1d1d" stroke-width="1"/>
        <path d="M170 170 Q165 140 155 128 Q163 150 172 167" fill="#7f1d1d" stroke="#991b1b" stroke-width=".8"/>

        <!-- Teeth -->
        <path d="M200 185 L205 190 L210 185 L215 190 L220 185" fill="none" stroke="#fbbf24" stroke-width=".8"/>

        <!-- Fire breath -->
        <path d="M230 185 Q255 178 280 185 Q270 192 255 188 Z" fill="url(#fireGrad)" opacity=".7" filter="blur(2px)"/>
        <path d="M228 187 Q255 175 285 185" fill="none" stroke="#f97316" stroke-width="2" opacity=".6"/>

        <!-- Front leg -->
        <path d="M160 340 Q150 390 140 420 L155 425 Q165 390 170 340 Z" fill="#1a0000" stroke="#7f1d1d" stroke-width="1.2"/>
        <!-- Front claws -->
        <path d="M140 422 L132 428 M145 423 L142 430 M155 425 L158 430" fill="none" stroke="#fbbf24" stroke-width=".8"/>

        <!-- Body spikes -->
        <path d="M120 325 L110 310 M150 310 L142 295 M190 305 L185 288 M240 308 L238 290 M290 315 L292 298 M340 330 L348 315 M390 355 L400 340" fill="none" stroke="#991b1b" stroke-width="1.2"/>

        <!-- Scales pattern -->
        <path d="M130 360 Q140 355 150 360 M170 345 Q180 340 190 345 M210 340 Q220 335 230 340 M260 345 Q270 340 280 345 M310 355 Q320 350 330 355 M360 365 Q370 360 380 365" fill="none" stroke="#450a0a" stroke-width=".6" opacity=".5"/>

        <!-- Chest scales -->
        <path d="M100 350 L115 355 M95 365 L112 368 M105 380 L120 380" fill="none" stroke="#7f1d1d" stroke-width=".8"/>
      </svg>
      <div class="fire-particles" id="firepts"></div>
    </div>

    <!-- BLUE DRAGON -->
    <div class="dragon-blue">
      <div class="wing-blur"></div>
      <svg class="dragon-svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMax meet">
        <defs>
          <radialGradient id="blueGlow"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/><stop offset="100%" stop-color="transparent"/></radialGradient>
          <linearGradient id="iceGrad" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
        </defs>
        
        <!-- Body glow -->
        <ellipse cx="280" cy="300" rx="180" ry="140" fill="url(#blueGlow)"/>

        <!-- Body curve -->
        <path d="M420 380 Q380 350 320 320 Q260 290 220 310 Q180 330 150 350 Q120 370 80 360 L100 420 Q150 440 220 430 Q300 420 380 430 Z" fill="#000a14" stroke="#1e3a5f" stroke-width="1.5"/>
        <path d="M380 405 Q300 400 220 410 Q150 420 100 405" fill="none" stroke="#0c2238" stroke-width="6" opacity=".6"/>

        <!-- Tail wraps -->
        <path d="M80 360 Q30 340 10 370 Q-10 400 20 430 Q50 460 100 445 Q150 430 180 440" fill="none" stroke="#1e3a5f" stroke-width="3"/>
        <path d="M20 430 Q-10 400 10 370" fill="none" stroke="#1e40af" stroke-width="2"/>
        <!-- Tail spikes (ice crystal) -->
        <path d="M30 385 L15 370 L25 380 M10 400 L-10 390 L5 395 M20 425 L0 430 L15 420" fill="#0c2238" stroke="#1e40af" stroke-width="1"/>

        <!-- Wing (spread) -->
        <path d="M300 310 Q340 180 400 120 Q360 160 330 200 Q320 140 300 80 Q290 140 280 180 Q260 120 220 90 Q250 160 260 210 Q240 180 200 140 Q240 200 270 250" fill="rgba(12,34,56,.4)" stroke="#1e40af" stroke-width="1.2"/>
        <path d="M300 310 Q360 200 400 120 M300 310 Q320 160 300 80 M300 310 Q270 160 220 90 M300 310 Q240 190 200 140" fill="none" stroke="#1e40af" stroke-width=".8" opacity=".6"/>

        <!-- Neck -->
        <path d="M380 380 Q400 340 410 300 Q420 260 400 230 Q380 200 340 190" fill="none" stroke="#1e3a5f" stroke-width="14" stroke-linecap="round"/>
        <path d="M380 380 Q400 340 410 300 Q420 260 400 230 Q380 200 340 190" fill="none" stroke="#0c2238" stroke-width="8" stroke-linecap="round"/>

        <!-- Head -->
        <ellipse cx="325" cy="185" rx="22" ry="18" fill="#000a14" stroke="#1e40af" stroke-width="1.5"/>
        <!-- Snout -->
        <path d="M305 185 Q280 180 270 185 Q275 192 305 192 Z" fill="#000a14" stroke="#1e40af" stroke-width="1.2"/>
        <path d="M305 182 Q285 178 270 183" fill="none" stroke="#1e40af" stroke-width="1.5"/>
        <path d="M305 192 Q285 195 272 189" fill="none" stroke="#1e40af" stroke-width="1.2"/>
        <!-- Nostril -->
        <ellipse cx="275" cy="184" rx="2.5" ry="1.5" fill="#0c2238"/>
        <!-- Eye -->
        <ellipse cx="318" cy="180" rx="4" ry="3" fill="#7dd3fc" stroke="#3b82f6" stroke-width=".8"/>
        <ellipse cx="318" cy="180" rx="1.5" ry="2.5" fill="#000"/>

        <!-- Horns (crystal) -->
        <path d="M335 172 Q345 145 360 135 Q350 155 338 170" fill="#1e3a5f" stroke="#1e40af" stroke-width="1"/>
        <path d="M330 170 Q335 140 345 128 Q337 150 328 167" fill="#0c2238" stroke="#1e40af" stroke-width=".8"/>

        <!-- Teeth -->
        <path d="M300 185 L295 190 L290 185 L285 190 L280 185" fill="none" stroke="#7dd3fc" stroke-width=".8"/>

        <!-- Ice breath -->
        <path d="M270 185 Q245 178 220 185 Q230 192 245 188 Z" fill="url(#iceGrad)" opacity=".6" filter="blur(2px)"/>
        <path d="M272 187 Q245 175 215 185" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".5"/>

        <!-- Front leg -->
        <path d="M340 340 Q350 390 360 420 L345 425 Q335 390 330 340 Z" fill="#000a14" stroke="#1e3a5f" stroke-width="1.2"/>
        <!-- Claws -->
        <path d="M360 422 L368 428 M355 423 L358 430 M345 425 L342 430" fill="none" stroke="#7dd3fc" stroke-width=".8"/>

        <!-- Body spikes (ice crystals) -->
        <path d="M380 325 L390 310 M350 310 L358 295 M310 305 L315 288 M260 308 L262 290 M210 315 L208 298 M160 330 L152 315 M110 355 L100 340" fill="none" stroke="#1e40af" stroke-width="1.2"/>

        <!-- Scales -->
        <path d="M370 360 Q360 355 350 360 M330 345 Q320 340 310 345 M290 340 Q280 335 270 340 M240 345 Q230 340 220 345 M190 355 Q180 350 170 355 M140 365 Q130 360 120 365" fill="none" stroke="#0c2238" stroke-width=".6" opacity=".5"/>

        <!-- Chest -->
        <path d="M400 350 L385 355 M405 365 L388 368 M395 380 L380 380" fill="none" stroke="#1e3a5f" stroke-width=".8"/>
      </svg>
      <div class="ice-particles" id="icepts"></div>
    </div>

  </div>
</div>

<div class="overlay">
  <a href="/fire" class="choice choice-l">
    <div class="choice-hint"><span class="c1">The Self</span><span class="c2">ABOUT</span><span class="c3">Leo · Identity · Fire</span></div>
  </a>
  <a href="/water" class="choice choice-r">
    <div class="choice-hint"><span class="c1">The Work</span><span class="c2">CREATE</span><span class="c3">Tools · Builds · Output</span></div>
  </a>
</div>

<script>
// Starfield
(function(){
var c=document.getElementById('stars'),ctx=c.getContext('2d'),w,h;
function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
R();window.addEventListener('resize',R);
var stars=[];
for(var i=0;i<120;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*.8+.1,o:Math.random()*.5+.1,p:Math.random()*Math.PI*2});
(function D(t){
if(w!==c.width||h!==c.height)R();
ctx.clearRect(0,0,w,h);
stars.forEach(function(s){var b=.4+.6*Math.sin(t*.002+s.p);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(s.o*b)+')';ctx.fill()});
requestAnimationFrame(D);
})();
})();

// Fire particles
(function(){
var c=document.getElementById('firepts'),h='';
for(var i=0;i<40;i++)h+='<div class="fp" style="left:'+(Math.random()*40)+'px;top:'+(Math.random()*20)+'px;--tx:'+((Math.random()-.5)*60)+'px;--ty:'+(-20-Math.random()*40)+'px;--d:'+(.8+Math.random()*1.5)+'s;--del:'+(Math.random()*2)+'s"></div>';
c.innerHTML=h;
})();

// Ice particles
(function(){
var c=document.getElementById('icepts'),h='';
for(var i=0;i<40;i++)h+='<div class="ip" style="right:'+(Math.random()*40)+'px;top:'+(Math.random()*20)+'px;--tx:'+((Math.random()-.5)*50)+'px;--ty:'+(-15-Math.random()*35)+'px;--d:'+(.8+Math.random()*1.5)+'s;--del:'+(Math.random()*2)+'s"></div>';
c.innerHTML=h;
})();

// Sky lightning
(function(){
var c=document.getElementById('sky-bolts'),h='';
for(var i=0;i<6;i++){
  var x=10+Math.random()*80,y=5+Math.random()*15,hgt=30+Math.random()*70;
  h+='<div class="lightning-bolt" style="left:'+x+'%;top:'+y+'%;height:'+hgt+'px;--d:'+(2+Math.random()*4)+'s;--del:'+(Math.random()*4)+'s;transform:rotate('+((Math.random()-.5)*15)+'deg)"></div>';
}
c.innerHTML=h;
})();
</script>
</body>
</html>
