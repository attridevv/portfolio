<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;cursor:crosshair}
canvas{display:block;position:fixed;inset:0}

.overlay{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex}
.zone{flex:1;cursor:pointer;pointer-events:auto;position:relative}
.zone:hover .zone-hint{opacity:1}

.zone-hint{
  position:absolute;bottom:3rem;left:50%;transform:translateX(-50%);
  text-align:center;opacity:0;transition:opacity .5s;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.zone-left .zone-hint{color:#fca5a5}
.zone-right .zone-hint{color:#93c5fd}
.zone-hint .label{display:block;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:.2rem}
.zone-hint .name{display:block;font-size:1rem;font-weight:900;letter-spacing:.06em}
.zone-hint .sub{display:block;font-size:.45rem;letter-spacing:.1em;margin-top:.2rem;opacity:.5}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay">
  <a href="/fire" class="zone zone-left">
    <div class="zone-hint"><span class="label">The Self</span><span class="name">ABOUT</span><span class="sub">Who I am · Leo</span></div>
  </a>
  <a href="/water" class="zone zone-right">
    <div class="zone-hint"><span class="label">The Work</span><span class="name">CREATE</span><span class="sub">Tools · What I build</span></div>
  </a>
</div>

<script>
(function(){
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W,H,t=0,lt=0;

function R(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
R();window.addEventListener('resize',R);

// Frame counter
var frame=0;

// Lightning state - regenerates periodically
var bolts=[];
var lastGen=0;

function genLightning(cx,cy,len,angle,thick,depth){
  var pts=[{x:cx,y:cy}];
  var a=angle,l=len,x=cx,y=cy;
  var steps=Math.floor(len/6);

  for(var i=0;i<steps&&depth>0;i++){
    var segLen=l/steps;
    a+=(Math.random()-.5)*.8;
    x+=Math.cos(a)*segLen;
    y+=Math.sin(a)*segLen;
    pts.push({x,y});

    // Fork
    if(Math.random()<.15&&depth>1){
      var forkLen=l*(.3+Math.random()*.4);
      var forkAngle=a+(Math.random()-.5)*1.2;
      var child=genLightning(x,y,forkLen,forkAngle,thick*.5,depth-1);
      if(child.length>1)pts.push({fork:child});
    }
  }
  return pts;
}

// Initialize bolts
function initBolts(){
  bolts=[];
  var cx=W/2,cy=H*.15;
  var main=genLightning(cx,cy,H*.75,Math.PI/2,12,5);
  bolts.push({pts:main,alpha:1,phase:Math.random()*Math.PI*2});
  // Side branches
  for(var i=0;i<3;i++){
    var ang=Math.PI/2+(Math.random()-.5)*1.2;
    var b=genLightning(cx+H*.1*(Math.random()-.5),cy+H*.15,H*.5,ang,6,4);
    bolts.push({pts:b,alpha:.6+Math.random()*.4,phase:Math.random()*Math.PI*2});
  }
}

// Draw lightning bolt with glow
function drawBolt(pts,baseAlpha,phase,baseThick){
  if(!pts||pts.length<2)return;

  var alpha=baseAlpha*(.7+.3*Math.sin(t*.003+phase));

  // Glow pass - thick, translucent
  ctx.strokeStyle='rgba(168,85,247,'+(alpha*.3)+')';
  ctx.lineWidth=baseThick*3;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor='rgba(168,85,247,'+(alpha*.6)+')';
  ctx.shadowBlur=20;
  ctx.beginPath();
  drawPath(pts);
  ctx.stroke();

  // White-hot core
  ctx.strokeStyle='rgba(255,255,255,'+(alpha*.7)+')';
  ctx.lineWidth=baseThick*.3;
  ctx.shadowColor='rgba(255,255,255,'+(alpha*.8)+')';
  ctx.shadowBlur=8;
  ctx.beginPath();
  drawPath(pts);
  ctx.stroke();

  // Purple mid-layer
  ctx.strokeStyle='rgba(200,120,255,'+(alpha*.5)+')';
  ctx.lineWidth=baseThick*1.2;
  ctx.shadowColor='rgba(200,120,255,'+(alpha*.4)+')';
  ctx.shadowBlur=14;
  ctx.beginPath();
  drawPath(pts);
  ctx.stroke();

  ctx.shadowBlur=0;
}

function drawPath(pts){
  ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++){
    if(pts[i].fork){
      ctx.lineTo(pts[i-1].x,pts[i-1].y);
      drawPath(pts[i].fork);
      ctx.moveTo(pts[i-1].x,pts[i-1].y);
    }else{
      ctx.lineTo(pts[i].x,pts[i].y);
    }
  }
}

// Get bottom of bolt for warrior placement
function getBoltBottom(pts){
  function findDeepest(p){
    var deepest=p[p.length-1];
    for(var i=0;i<p.length;i++){
      if(p[i].fork){var d=findDeepest(p[i].fork);if(d.y>deepest.y)deepest=d;}
    }
    return deepest;
  }
  return findDeepest(pts);
}

// Warrior drawing - left (red, dual swords)
function drawRedWarrior(x,y,scale){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);

  // Red glow aura
  var glow=ctx.createRadialGradient(0,-20,5,0,-20,90);
  glow.addColorStop(0,'rgba(239,68,68,.3)');glow.addColorStop(.5,'rgba(239,68,68,.08)');glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,-25,85,0,Math.PI*2);ctx.fill();

  // Body
  ctx.fillStyle='#0a0000';ctx.strokeStyle='rgba(239,68,68,.4)';ctx.lineWidth=1.5;
  // Head
  ctx.beginPath();ctx.arc(0,-55,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Neck
  ctx.beginPath();ctx.moveTo(0,-47);ctx.lineTo(0,-37);ctx.stroke();
  // Torso
  ctx.beginPath();ctx.moveTo(-12,-37);ctx.lineTo(-14,-15);ctx.lineTo(14,-15);ctx.lineTo(12,-37);ctx.closePath();ctx.fill();ctx.stroke();
  // Shoulders
  ctx.beginPath();ctx.moveTo(-22,-33);ctx.lineTo(22,-33);ctx.stroke();
  // Arms
  ctx.beginPath();ctx.moveTo(-22,-33);ctx.lineTo(-30,-20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(22,-33);ctx.lineTo(30,-20);ctx.stroke();
  // Legs
  ctx.beginPath();ctx.moveTo(-10,-15);ctx.lineTo(-8,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-15);ctx.lineTo(8,0);ctx.stroke();

  // Dual Swords - crossed
  ctx.strokeStyle='#ef4444';ctx.lineWidth=2;ctx.shadowColor='rgba(239,68,68,.8)';ctx.shadowBlur=12;
  // Left sword (angled up-left)
  ctx.beginPath();ctx.moveTo(-30,-18);ctx.lineTo(-50,-52);
  ctx.stroke();ctx.shadowBlur=0;
  // Right sword (angled up-right)
  ctx.beginPath();ctx.moveTo(30,-18);ctx.lineTo(50,-52);
  ctx.stroke();
  // Guard lines
  ctx.strokeStyle='rgba(239,68,68,.6)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-35,-22);ctx.lineTo(-26,-18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(35,-22);ctx.lineTo(26,-18);ctx.stroke();

  ctx.restore();
}

// Warrior drawing - right (blue, single large sword)
function drawBlueWarrior(x,y,scale){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);

  // Blue glow aura
  var glow=ctx.createRadialGradient(0,-20,5,0,-20,90);
  glow.addColorStop(0,'rgba(59,130,246,.3)');glow.addColorStop(.5,'rgba(59,130,246,.08)');glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,-25,85,0,Math.PI*2);ctx.fill();

  // Body
  ctx.fillStyle='#000a14';ctx.strokeStyle='rgba(59,130,246,.4)';ctx.lineWidth=1.5;
  // Head
  ctx.beginPath();ctx.arc(0,-55,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Neck
  ctx.beginPath();ctx.moveTo(0,-47);ctx.lineTo(0,-37);ctx.stroke();
  // Torso (Ichigo style - broader shoulders)
  ctx.beginPath();ctx.moveTo(-14,-37);ctx.lineTo(-16,-15);ctx.lineTo(16,-15);ctx.lineTo(14,-37);ctx.closePath();ctx.fill();ctx.stroke();
  // Shoulders
  ctx.beginPath();ctx.moveTo(-24,-33);ctx.lineTo(24,-33);ctx.stroke();
  // Arms
  ctx.beginPath();ctx.moveTo(-24,-33);ctx.lineTo(-32,-18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(24,-33);ctx.lineTo(32,-18);ctx.stroke();
  // Legs
  ctx.beginPath();ctx.moveTo(-10,-15);ctx.lineTo(-8,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-15);ctx.lineTo(8,0);ctx.stroke();

  // Single Large Sword (held in right, over shoulder)
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;ctx.shadowColor='rgba(59,130,246,.8)';ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(30,-18);ctx.lineTo(52,-62);ctx.stroke();ctx.shadowBlur=0;
  // Wide blade
  ctx.strokeStyle='rgba(147,197,253,.4)';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(30,-22);ctx.lineTo(50,-58);ctx.stroke();
  // Guard
  ctx.strokeStyle='rgba(59,130,246,.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(26,-24);ctx.lineTo(34,-20);ctx.stroke();

  ctx.restore();
}

// Particles
var particles=[];
for(var i=0;i<100;i++){
  particles.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3-.2,
    r:Math.random()*1+.3,o:Math.random()*.4+.1,life:Math.random()*200
  });
}

function draw(timestamp){
  t=timestamp;
  if(W!==c.width||H!==c.height){R();initBolts();}

  // Regenerate lightning
  if(t-lt>3000+Math.random()*2000){initBolts();lt=t;}

  ctx.clearRect(0,0,W,H);

  // Background - subtle nebula
  var neb=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  neb.addColorStop(0,'rgba(10,0,20,.4)');neb.addColorStop(.5,'rgba(5,0,15,.2)');neb.addColorStop(1,'#000');
  ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);

  // Background stars
  particles.forEach(function(p,i){
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.x<0||p.x>W||p.y<0||p.y>H||p.life<=0){
      p.x=Math.random()*W;p.y=Math.random()*H;p.life=200+Math.random()*200;
      p.vx=(Math.random()-.5)*.3;p.vy=(Math.random()-.5)*.3-.2;
    }
    var blink=.5+.5*Math.sin(t*.005+i*.1);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(p.o*blink)+')';ctx.fill();
  });

  // Draw all lightning bolts
  bolts.forEach(function(b){
    drawBolt(b.pts,b.alpha,b.phase,8);
  });

  // Calculate warrior positions from bolt bottoms
  if(bolts.length>0){
    var mainBolt=bolts[0].pts;
    // Find leftmost and rightmost bottom points
    function collectBottoms(pts,arr){
      for(var i=0;i<pts.length;i++){
        if(pts[i].fork)collectBottoms(pts[i].fork,arr);
      }
      arr.push(pts[pts.length-1]);
    }
    var bottoms=[];
    collectBottoms(mainBolt,bottoms);
    bottoms.sort(function(a,b){return a.x-b.x});

    if(bottoms.length>=2){
      var leftPt=bottoms[0];
      var rightPt=bottoms[bottoms.length-1];
      // Draw warriors
      drawRedWarrior(leftPt.x,leftPt.y-10,.9);
      drawBlueWarrior(rightPt.x,rightPt.y-10,.9);
    }else if(bottoms.length===1){
      drawRedWarrior(bottoms[0].x-40,bottoms[0].y-10,.8);
      drawBlueWarrior(bottoms[0].x+40,bottoms[0].y-10,.8);
    }
  }

  // Central flash effect
  var flashAlpha=.08+.04*Math.sin(t*.004);
  var flash=ctx.createRadialGradient(W/2,H*.2,0,W/2,H*.3,Math.min(W,H)*.6);
  flash.addColorStop(0,'rgba(168,85,247,'+flashAlpha+')');
  flash.addColorStop(1,'transparent');
  ctx.fillStyle=flash;ctx.fillRect(0,0,W,H);

  frame++;
  requestAnimationFrame(draw);
}

initBolts();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
