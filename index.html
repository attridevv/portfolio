<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --fire:#f97316;--fire2:#c2410c;--fire3:#431407;
  --water:#38bdf8;--water2:#0ea5e9;--water3:#0c4a6e;
  --ice:#e0f2fe;--ice2:#7dd3fc;--ice3:#475569;
  --thunder:#facc15;--thunder2:#eab308;--thunder3:#713f12;
  --void:#a78bfa;--void2:#8b5cf6;--void3:#2e1065;
}

body{
  background:#010105;color:#e2e8f0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  width:100vw;height:100vh;overflow:hidden;
}

.map{
  display:grid;
  grid-template-columns:1.2fr .25fr 2fr .25fr 1.2fr;
  grid-template-rows:1.2fr .25fr 2fr .25fr 1.2fr;
  width:100%;height:100%;
}

/* Territory cells */
.territory{
  position:relative;
  overflow:hidden;
  cursor:pointer;
  text-decoration:none;color:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:all .5s cubic-bezier(.16,1,.3,1);
}
.territory:hover{z-index:10;transform:scale(1.03)}
.territory:active{transform:scale(.98)}

/* Territory backgrounds with animated gradients */
.fire-territory{
  background:var(--fire3);
  background-image:
    radial-gradient(ellipse at 40% 35%,#fbbf24 0%,transparent 30%),
    radial-gradient(ellipse at 60% 55%,#f97316 0%,transparent 35%),
    radial-gradient(ellipse at 50% 70%,#ef4444 0%,transparent 30%),
    radial-gradient(ellipse at 50% 50%,#7c2d12 0%,var(--fire3) 70%);
  animation:fireBreathe 4s ease-in-out infinite alternate;
}
@keyframes fireBreathe{
  0%{background-size:100% 100%,100% 100%,100% 100%,100% 100%}
  100%{background-size:120% 110%,110% 120%,115% 115%,105% 105%}
}

.thunder-territory{
  background:var(--thunder3);
  background-image:
    radial-gradient(ellipse at 50% 30%,#fef08a 0%,transparent 25%),
    radial-gradient(ellipse at 45% 50%,#facc15 0%,transparent 30%),
    radial-gradient(ellipse at 55% 60%,#eab308 0%,transparent 35%),
    radial-gradient(ellipse at 50% 75%,#854d0e 0%,var(--thunder3) 70%);
  animation:thunderFlash 3s ease-in-out infinite;
}
@keyframes thunderFlash{
  0%,90%,100%{filter:brightness(1)}
  45%{filter:brightness(1.3)}
  48%{filter:brightness(.7)}
  50%{filter:brightness(1.6)}
  52%{filter:brightness(.8)}
}

.ice-territory{
  background:var(--ice3);
  background-image:
    radial-gradient(ellipse at 55% 35%,#f0f9ff 0%,transparent 28%),
    radial-gradient(ellipse at 40% 50%,#bae6fd 0%,transparent 30%),
    radial-gradient(ellipse at 60% 60%,#7dd3fc 0%,transparent 32%),
    radial-gradient(ellipse at 50% 70%,#64748b 0%,var(--ice3) 70%);
  animation:iceShimmer 5s ease-in-out infinite alternate;
}
@keyframes iceShimmer{
  0%{filter:brightness(1) saturate(.8)}
  100%{filter:brightness(1.15) saturate(1)}
}

.water-territory{
  background:var(--water3);
  background-image:
    radial-gradient(ellipse at 50% 40%,#bae6fd 0%,transparent 28%),
    radial-gradient(ellipse at 40% 55%,#38bdf8 0%,transparent 30%),
    radial-gradient(ellipse at 60% 65%,#0ea5e9 0%,transparent 32%),
    radial-gradient(ellipse at 50% 80%,#1e3a5f 0%,var(--water3) 70%);
  animation:waterFlow 6s ease-in-out infinite;
}
@keyframes waterFlow{
  0%,100%{background-position:0 0,0 0,0 0,0 0}
  33%{background-position:2% 1%,-1% 0%,1% 2%,0 -1%}
  66%{background-position:-1% -1%,2% 1%,-2% 1%,1% 1%}
}

.void-territory{
  background:var(--void3);
  background-image:
    radial-gradient(ellipse at 50% 30%,#c4b5fd 0%,transparent 25%),
    radial-gradient(ellipse at 45% 55%,#a78bfa 0%,transparent 30%),
    radial-gradient(ellipse at 55% 65%,#7c3aed 0%,transparent 32%),
    radial-gradient(ellipse at 50% 80%,#3b0764 0%,var(--void3) 70%);
  animation:voidBreathe 7s ease-in-out infinite alternate;
}
@keyframes voidBreathe{
  0%{filter:brightness(1);background-size:100% 100%,100% 100%,100% 100%,100% 100%}
  100%{filter:brightness(1.2);background-size:115% 110%,110% 115%,112% 112%,108% 108%}
}

/* Content inside territories */
.territory-content{
  position:relative;z-index:2;text-align:center;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
.territory:hover .territory-content{transform:translateY(-4px)}

.territory-number{
  display:block;font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;
  margin-bottom:.3rem;font-weight:700;opacity:.6;
}
.fire-territory .territory-number{color:#fb923c}
.thunder-territory .territory-number{color:#facc15}
.ice-territory .territory-number{color:#bae6fd}
.water-territory .territory-number{color:#38bdf8}
.void-territory .territory-number{color:#a78bfa}

.territory-name{
  display:block;font-size:1.3rem;font-weight:900;letter-spacing:.1em;
  margin-bottom:.15rem;transition:text-shadow .4s;
}
.fire-territory .territory-name{color:#ea580c}
.thunder-territory .territory-name{color:#eab308}
.ice-territory .territory-name{color:#e0f2fe}
.water-territory .territory-name{color:#0ea5e9}
.void-territory .territory-name{color:#7c3aed}
.territory:hover .territory-name{text-shadow:0 0 30px currentColor}

.territory-sub{
  display:block;font-size:.48rem;color:#52525b;letter-spacing:.06em;
  transition:color .4s;
}
.territory:hover .territory-sub{color:#a1a1aa}

/* Grid placement */
.fire-slot{grid-column:3;grid-row:3}
.thunder-slot{grid-column:3;grid-row:1}
.ice-slot{grid-column:5;grid-row:3}
.water-slot{grid-column:3;grid-row:5}
.void-slot{grid-column:1;grid-row:3}

/* Transition borders (the cells between territories) */
.transition{
  position:relative;overflow:hidden;
  pointer-events:none;
}

/* Fire ↔ Thunder: Rising heat */
.fire-thunder-h{grid-column:3;grid-row:2}
.fire-thunder-h::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,var(--thunder3),var(--fire3));
  animation:heatRise 3s ease-in-out infinite alternate;
}
@keyframes heatRise{
  0%{background:linear-gradient(to bottom,var(--thunder3),var(--fire3));opacity:.5}
  100%{background:linear-gradient(to bottom,#422006,var(--fire3));opacity:.8}
}

/* Fire ↔ Ice: Through water */
.fire-ice-h{grid-column:4;grid-row:3}
.fire-ice-h::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right,var(--fire3),var(--water3),var(--ice3));
  animation:waterBridge 4s ease-in-out infinite alternate;
}
@keyframes waterBridge{
  0%{background:linear-gradient(to right,var(--fire3),var(--water3),var(--ice3))}
  100%{background:linear-gradient(to right,#431407,#0c4a6e,#475569)}
}

/* Fire ↔ Water: Steam */
.fire-water-v{grid-column:3;grid-row:4}
.fire-water-v::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,var(--fire3),var(--water3));
  animation:steamRise 3.5s ease-in-out infinite alternate;
}
@keyframes steamRise{
  0%{background:linear-gradient(to bottom,var(--fire3),var(--water3));opacity:.4}
  100%{background:linear-gradient(to bottom,var(--fire3),#0c4a6e);opacity:.7}
}

/* Fire ↔ Void: Smoke */
.fire-void-h{grid-column:2;grid-row:3}
.fire-void-h::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right,var(--void3),#1a0a20,var(--fire3));
  animation:smokeDrift 5s ease-in-out infinite alternate;
}
@keyframes smokeDrift{
  0%{background:linear-gradient(to right,var(--void3),#1a0a20,var(--fire3))}
  100%{background:linear-gradient(to right,#2e1065,#2a0a15,var(--fire3))}
}

/* Thunder ↔ Void: Dark lightning */
.thunder-void-h{grid-column:2;grid-row:1}
.thunder-void-h::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right,var(--void3),#1a0a20,var(--thunder3));
  animation:darkStrike 4s ease-in-out infinite;
}
@keyframes darkStrike{
  0%,85%,100%{opacity:.3}
  45%{opacity:.7}
  48%{opacity:.2}
  50%{opacity:1}
  52%{opacity:.3}
}

/* Thunder ↔ Ice: Storm front */
.thunder-ice-h{grid-column:4;grid-row:1}
.thunder-ice-h::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right,var(--thunder3),#2a2a10,var(--ice3));
  animation:stormFront 5s ease-in-out infinite alternate;
}
@keyframes stormFront{
  0%{background:linear-gradient(to right,var(--thunder3),#2a2a10,var(--ice3));filter:brightness(.8)}
  100%{background:linear-gradient(to right,#713f12,#2a3a20,var(--ice3));filter:brightness(1.1)}
}

/* Ice ↔ Water: Freeze/flow */
.ice-water-v{grid-column:5;grid-row:4}
.ice-water-v::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,var(--ice3),var(--water3));
  animation:freezeFlow 5s ease-in-out infinite alternate;
}
@keyframes freezeFlow{
  0%{background:linear-gradient(to bottom,var(--ice3),var(--water3))}
  100%{background:linear-gradient(to bottom,#64748b,var(--water3))}
}

/* Water ↔ Void: Deep abyss */
.water-void-v{grid-column:1;grid-row:4}
.water-void-v::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,var(--water3),var(--void3));
  animation:abyssPull 6s ease-in-out infinite alternate;
}
@keyframes abyssPull{
  0%{background:linear-gradient(to bottom,var(--water3),var(--void3))}
  100%{background:linear-gradient(to bottom,#0c1929,#2e1065)}
}

/* Thunder ↔ Water: Diagonal storm */
.thunder-water-d{grid-column:4;grid-row:2}
.thunder-water-d::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--thunder3),var(--water3));
  animation:stormDiagonal 4s ease-in-out infinite alternate;
}
@keyframes stormDiagonal{
  0%{opacity:.3;filter:brightness(.8)}
  100%{opacity:.6;filter:brightness(1.1)}
}

/* Ice ↔ Void: Diagonal frost-dark */
.ice-void-d{grid-column:2;grid-row:5}
.ice-void-d::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,var(--void3),var(--ice3));
  animation:frostDark 5.5s ease-in-out infinite alternate;
}
@keyframes frostDark{
  0%{opacity:.25}
  100%{opacity:.5}
}

/* Corner cells - ambient void */
.corner{background:radial-gradient(ellipse at 50% 50%,rgba(15,15,30,.6),#010105)}
.corner::after{
  content:'';position:absolute;inset:0;
  animation:cornerPulse 8s ease-in-out infinite alternate;
}
@keyframes cornerPulse{
  0%{background:radial-gradient(ellipse at 50% 50%,rgba(15,15,30,.3),transparent)}
  100%{background:radial-gradient(ellipse at 50% 50%,rgba(20,15,35,.5),transparent)}
}

/* Canvas particles overlay */
canvas#particles{position:fixed;inset:0;z-index:5;pointer-events:none}

/* Territory particle overlays */
.territory-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tp{position:absolute;border-radius:50%;animation:tpDrift var(--dur) ease-in-out infinite;animation-delay:var(--del)}
.fire-territory .tp{background:rgba(251,191,36,.6);width:2px;height:2px}
.thunder-territory .tp{background:rgba(254,240,138,.7);width:1.5px;height:3px}
.ice-territory .tp{background:rgba(255,255,255,.5);width:2px;height:2px}
.water-territory .tp{background:rgba(255,255,255,.5);width:2px;height:3px;border-radius:40%}
.void-territory .tp{background:rgba(196,181,253,.4);width:2px;height:2px}

@keyframes tpDrift{
  0%{transform:translate(0,0);opacity:var(--op)}
  50%{transform:translate(var(--dx),var(--dy));opacity:.1}
  100%{transform:translate(0,0);opacity:var(--op)}
}

/* Corner placements */
.c1{grid-column:1;grid-row:1}.c2{grid-column:5;grid-row:1}
.c3{grid-column:1;grid-row:5}.c4{grid-column:5;grid-row:5}

/* Responsive */
@media(max-width:768px){
  .map{
    grid-template-columns:1fr .15fr 2fr .15fr 1fr;
    grid-template-rows:1fr .15fr 2fr .15fr 1fr;
  }
  .territory-name{font-size:.9rem}
  .territory-number{font-size:.4rem}
  .territory-sub{font-size:.4rem}
}
</style>
</head>
<body>

<div class="map">

  <!-- CENTER: FIRE -->
  <a href="/fire" class="territory fire-territory fire-slot">
    <div class="territory-particles" data-elem="fire"></div>
    <div class="territory-content">
      <span class="territory-number">Realm I</span>
      <span class="territory-name">Fire</span>
      <span class="territory-sub">Leo · About Me</span>
    </div>
  </a>

  <!-- TOP: THUNDER -->
  <a href="/lightning" class="territory thunder-territory thunder-slot">
    <div class="territory-particles" data-elem="thunder"></div>
    <div class="territory-content">
      <span class="territory-number">Realm IV</span>
      <span class="territory-name">Thunder</span>
      <span class="territory-sub">Ambitions · Goals</span>
    </div>
  </a>

  <!-- RIGHT: ICE -->
  <a href="/ice" class="territory ice-territory ice-slot">
    <div class="territory-particles" data-elem="ice"></div>
    <div class="territory-content">
      <span class="territory-number">Realm III</span>
      <span class="territory-name">Ice</span>
      <span class="territory-sub">Creativity · Vent</span>
    </div>
  </a>

  <!-- BOTTOM: WATER -->
  <a href="/water" class="territory water-territory water-slot">
    <div class="territory-particles" data-elem="water"></div>
    <div class="territory-content">
      <span class="territory-number">Realm II</span>
      <span class="territory-name">Water</span>
      <span class="territory-sub">Tools · My Work</span>
    </div>
  </a>

  <!-- LEFT: VOID -->
  <a href="/darkness" class="territory void-territory void-slot">
    <div class="territory-particles" data-elem="void"></div>
    <div class="territory-content">
      <span class="territory-number">Realm V</span>
      <span class="territory-name">Void</span>
      <span class="territory-sub">Admiration · Thanks</span>
    </div>
  </a>

  <!-- TRANSITION BORDERS -->
  <div class="transition fire-thunder-h"></div>
  <div class="transition fire-ice-h"></div>
  <div class="transition fire-water-v"></div>
  <div class="transition fire-void-h"></div>
  <div class="transition thunder-void-h"></div>
  <div class="transition thunder-ice-h"></div>
  <div class="transition ice-water-v"></div>
  <div class="transition water-void-v"></div>
  <div class="transition thunder-water-d"></div>
  <div class="transition ice-void-d"></div>

  <!-- CORNERS -->
  <div class="corner c1"></div>
  <div class="corner c2"></div>
  <div class="corner c3"></div>
  <div class="corner c4"></div>

</div>

<canvas id="particles"></canvas>

<script>
// Global particle canvas
(function(){
  var c=document.getElementById('particles'),ctx=c.getContext('2d'),w,h;
  function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  R();window.addEventListener('resize',R);

  var pts=[];
  for(var i=0;i<60;i++)pts.push({
    x:Math.random()*w,y:Math.random()*h,
    vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,
    r:Math.random()*.8+.2,o:Math.random()*.3+.1
  });

  function D(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+p.o+')';ctx.fill();
    });
    requestAnimationFrame(D);
  }
  D();
})();

// Territory-specific particles
(function(){
  var configs={
    fire:{count:25,gen:function(){return{left:Math.random()*100+'%',top:30+Math.random()*70+'%',dx:(Math.random()-.5)*30+'px',dy:(Math.random()-.8)*40+'px',dur:2+Math.random()*3+'s',del:Math.random()*3+'s',op:.3+Math.random()*.7}}},
    thunder:{count:20,gen:function(){return{left:Math.random()*100+'%',top:10+Math.random()*50+'%',dx:(Math.random()-.5)*50+'px',dy:(Math.random()-.5)*20+'px',dur:1.5+Math.random()*2+'s',del:Math.random()*2+'s',op:.3+Math.random()*.7}}},
    ice:{count:22,gen:function(){return{left:Math.random()*100+'%',top:Math.random()*100+'%',dx:(Math.random()-.5)*25+'px',dy:10+Math.random()*20+'px',dur:3+Math.random()*4+'s',del:Math.random()*4+'s',op:.3+Math.random()*.6}}},
    water:{count:20,gen:function(){return{left:Math.random()*100+'%',top:10+Math.random()*40+'%',dx:(Math.random()-.5)*20+'px',dy:15+Math.random()*25+'px',dur:3+Math.random()*5+'s',del:Math.random()*4+'s',op:.3+Math.random()*.5}}},
    void:{count:18,gen:function(){return{left:Math.random()*100+'%',top:Math.random()*100+'%',dx:(Math.random()-.5)*15+'px',dy:(Math.random()-.5)*15+'px',dur:4+Math.random()*5+'s',del:Math.random()*5+'s',op:.2+Math.random()*.5}}}
  };
  Object.keys(configs).forEach(function(k){
    var cfg=configs[k];
    var containers=document.querySelectorAll('[data-elem="'+k+'"]');
    containers.forEach(function(cont){
      var h='';
      for(var i=0;i<cfg.count;i++){
        var p=cfg.gen();
        h+='<div class="tp" style="left:'+p.left+';top:'+p.top+';--dx:'+p.dx+';--dy:'+p.dy+';--dur:'+p.dur+';--del:'+p.del+';--op:'+p.op+'"></div>';
      }
      cont.innerHTML=h;
    });
  });
})();
</script>
</body>
</html>
