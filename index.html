<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh}
canvas{display:block;position:fixed;inset:0}

.overlay{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex}
.zone{flex:1;cursor:pointer;pointer-events:auto;position:relative;text-decoration:none}
.zone:hover .zone-hint{opacity:1;transform:translateX(-50%)translateY(-4px)}

.zone-hint{
  position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);
  text-align:center;opacity:0;transition:all .5s;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.zone-l .zone-hint{color:#fca5a5}.zone-r .zone-hint{color:#93c5fd}
.zone-hint .label{display:block;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin-bottom:.15rem}
.zone-hint .name{display:block;font-size:.9rem;font-weight:900;letter-spacing:.08em}
.zone-hint .sub{display:block;font-size:.4rem;letter-spacing:.12em;margin-top:.15rem;opacity:.4}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay">
  <a href="/fire" class="zone zone-l"><div class="zone-hint"><span class="label">The Self</span><span class="name">ABOUT</span><span class="sub">Leo &middot; Identity &middot; Fire</span></div></a>
  <a href="/water" class="zone zone-r"><div class="zone-hint"><span class="label">The Work</span><span class="name">CREATE</span><span class="sub">Tools &middot; Builds &middot; Output</span></div></a>
</div>

<script>
(function(){
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W,H,t=0,lightningTick=0;

function R(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
R();window.addEventListener('resize',R);

// === KIRITO (left, red, dual swords) ===
function drawKirito(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Crimson aura glow
  var g=ctx.createRadialGradient(0,-30,15,0,-30,120);
  g.addColorStop(0,'rgba(220,38,38,.25)');g.addColorStop(.4,'rgba(239,68,68,.08)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-40,120,0,Math.PI*2);ctx.fill();

  // Shadow on ground
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,20,25,6,0,0,Math.PI*2);ctx.fill();

  // === BODY ===
  var body='#0a0005';var edge='rgba(239,68,68,.35)';

  // Legs
  ctx.fillStyle=body;ctx.strokeStyle=edge;ctx.lineWidth=1;
  // Left leg
  ctx.beginPath();ctx.moveTo(-8,15);ctx.lineTo(-12,38);ctx.lineTo(-6,40);ctx.lineTo(-4,15);ctx.fill();ctx.stroke();
  // Right leg  
  ctx.beginPath();ctx.moveTo(8,15);ctx.lineTo(12,38);ctx.lineTo(6,40);ctx.lineTo(4,15);ctx.fill();ctx.stroke();
  // Boots
  ctx.fillStyle='#1a0005';ctx.beginPath();ctx.rect(-14,38,10,5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.rect(4,38,10,5);ctx.fill();ctx.stroke();

  // Long coat - flowing trenchcoat
  ctx.fillStyle='#050000';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.moveTo(-18,-10);ctx.lineTo(-20,20);ctx.lineTo(-14,36);ctx.lineTo(-4,16);ctx.lineTo(4,16);ctx.lineTo(14,36);ctx.lineTo(20,20);ctx.lineTo(18,-10);ctx.closePath();ctx.fill();ctx.stroke();
  // Coat inner line
  ctx.strokeStyle='rgba(239,68,68,.2)';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,16);ctx.stroke();

  // Torso/chest
  ctx.fillStyle='#080000';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.moveTo(-14,-42);ctx.lineTo(-18,-10);ctx.lineTo(-12,-2);ctx.lineTo(12,-2);ctx.lineTo(18,-10);ctx.lineTo(14,-42);ctx.closePath();ctx.fill();ctx.stroke();
  // Belt
  ctx.strokeStyle='rgba(239,68,68,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-16,-10);ctx.lineTo(16,-10);ctx.stroke();

  // Shoulder armor plates
  ctx.fillStyle='#0a0000';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.moveTo(-18,-44);ctx.lineTo(-26,-36);ctx.lineTo(-20,-30);ctx.lineTo(-14,-40);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(18,-44);ctx.lineTo(26,-36);ctx.lineTo(20,-30);ctx.lineTo(14,-40);ctx.closePath();ctx.fill();ctx.stroke();

  // Arms
  ctx.fillStyle=body;ctx.strokeStyle=edge;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-20,-36);ctx.lineTo(-26,-20);ctx.lineTo(-22,-18);ctx.lineTo(-16,-34);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(20,-36);ctx.lineTo(26,-20);ctx.lineTo(22,-18);ctx.lineTo(16,-34);ctx.fill();ctx.stroke();

  // Neck
  ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-6,-42);ctx.lineTo(-5,-48);ctx.lineTo(5,-48);ctx.lineTo(6,-42);ctx.fill();

  // Head
  ctx.fillStyle='#0a0005';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.ellipse(0,-58,9,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Face profile
  ctx.fillStyle='rgba(239,68,68,.1)';ctx.beginPath();ctx.arc(0,-58,8,0,Math.PI*2);ctx.fill();
  // Eyes - glow
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(-3,-60,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-60,2,0,Math.PI*2);ctx.fill();

  // Spiky anime hair - Kirito style
  ctx.fillStyle='#0a0005';ctx.strokeStyle='rgba(239,68,68,.3)';
  ctx.beginPath();ctx.moveTo(-8,-66);ctx.lineTo(-14,-80);ctx.lineTo(-4,-74);ctx.lineTo(-2,-84);ctx.lineTo(5,-76);ctx.lineTo(12,-86);ctx.lineTo(10,-74);ctx.lineTo(16,-78);ctx.lineTo(10,-66);ctx.closePath();ctx.fill();ctx.stroke();

  // === DUAL SWORDS ===
  // Elucidator (right hand) - dark blade
  ctx.save();
  ctx.translate(22,-22);ctx.rotate(-.55);
  // Blade
  ctx.fillStyle='#1a0005';ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-3,45);ctx.lineTo(3,45);ctx.closePath();ctx.fill();ctx.stroke();
  // Blade edge glow
  ctx.strokeStyle='rgba(239,68,68,.5)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,43);ctx.stroke();
  // Guard
  ctx.fillStyle='#2a0005';ctx.strokeStyle='#ef4444';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(-8,-3,16,5,2);ctx.fill();ctx.stroke();
  // Handle
  ctx.fillStyle='#1a0005';ctx.beginPath();ctx.roundRect(-2,-15,4,14,1);ctx.fill();
  ctx.restore();

  // Dark Repulser (left hand) - lighter blade
  ctx.save();
  ctx.translate(-22,-22);ctx.rotate(-2.6);
  ctx.fillStyle='#0a0005';ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-3,40);ctx.lineTo(3,40);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(252,165,165,.5)';ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,38);ctx.stroke();
  ctx.fillStyle='#2a0005';ctx.strokeStyle='#ef4444';
  ctx.beginPath();ctx.roundRect(-7,-3,14,5,2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a0005';ctx.beginPath();ctx.roundRect(-2,-13,4,12,1);ctx.fill();
  ctx.restore();

  ctx.restore();
}

// === ICHIGO (right, blue, single zanpakuto) ===
function drawIchigo(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Blue aura
  var g=ctx.createRadialGradient(0,-30,15,0,-30,120);
  g.addColorStop(0,'rgba(37,99,235,.25)');g.addColorStop(.4,'rgba(59,130,246,.08)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-40,120,0,Math.PI*2);ctx.fill();

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,20,25,6,0,0,Math.PI*2);ctx.fill();

  var body='#000510';var edge='rgba(59,130,246,.35)';

  // Legs
  ctx.fillStyle=body;ctx.strokeStyle=edge;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-10,15);ctx.lineTo(-14,40);ctx.lineTo(-6,42);ctx.lineTo(-4,15);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,15);ctx.lineTo(14,40);ctx.lineTo(6,42);ctx.lineTo(4,15);ctx.fill();ctx.stroke();
  // Sandals
  ctx.fillStyle='#00081a';ctx.beginPath();ctx.rect(-16,38,12,6);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.rect(4,38,12,6);ctx.fill();ctx.stroke();

  // Shihakusho (robe) - wide hakama pants
  ctx.fillStyle='#000510';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.moveTo(-20,-14);ctx.lineTo(-22,10);ctx.lineTo(-16,36);ctx.lineTo(-6,18);ctx.lineTo(6,18);ctx.lineTo(16,36);ctx.lineTo(22,10);ctx.lineTo(20,-14);ctx.closePath();ctx.fill();ctx.stroke();
  // Robe opening
  ctx.strokeStyle='rgba(59,130,246,.15)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,10);ctx.stroke();

  // Upper body - kimono top
  ctx.fillStyle='#00081a';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.moveTo(-16,-44);ctx.lineTo(-20,-14);ctx.lineTo(-10,-4);ctx.lineTo(10,-4);ctx.lineTo(20,-14);ctx.lineTo(16,-44);ctx.closePath();ctx.fill();ctx.stroke();
  // Obi (belt/sash)
  ctx.fillStyle='#000a20';ctx.strokeStyle='rgba(59,130,246,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-18,-14);ctx.lineTo(18,-14);ctx.lineTo(17,-8);ctx.lineTo(-17,-8);ctx.closePath();ctx.fill();ctx.stroke();

  // Arms
  ctx.fillStyle=body;ctx.strokeStyle=edge;ctx.lineWidth=1;
  // Left arm (down, relaxed)
  ctx.beginPath();ctx.moveTo(-18,-38);ctx.lineTo(-22,-22);ctx.lineTo(-26,-12);ctx.lineTo(-22,-10);ctx.lineTo(-16,-20);ctx.fill();ctx.stroke();
  // Right arm (up/back, holding sword)
  ctx.beginPath();ctx.moveTo(18,-38);ctx.lineTo(24,-26);ctx.lineTo(30,-18);ctx.lineTo(28,-16);ctx.lineTo(20,-24);ctx.fill();ctx.stroke();

  // Shoulder - broader, Ichigo build
  ctx.fillStyle='#00081a';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.moveTo(-24,-46);ctx.lineTo(-28,-40);ctx.lineTo(-20,-34);ctx.lineTo(-14,-42);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(24,-46);ctx.lineTo(28,-40);ctx.lineTo(20,-34);ctx.lineTo(14,-42);ctx.closePath();ctx.fill();ctx.stroke();

  // Neck
  ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-7,-44);ctx.lineTo(-6,-50);ctx.lineTo(6,-50);ctx.lineTo(7,-44);ctx.fill();

  // Head
  ctx.fillStyle='#000510';ctx.strokeStyle=edge;
  ctx.beginPath();ctx.ellipse(0,-60,9,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Face
  ctx.fillStyle='rgba(59,130,246,.08)';ctx.beginPath();ctx.arc(0,-60,7,0,Math.PI*2);ctx.fill();
  // Eyes glowing
  ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(-3,-62,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-62,2,0,Math.PI*2);ctx.fill();

  // Spiky hair - Ichigo style (taller, wilder)
  ctx.fillStyle='#000510';ctx.strokeStyle='rgba(59,130,246,.3)';
  ctx.beginPath();ctx.moveTo(-8,-68);ctx.lineTo(-16,-84);ctx.lineTo(-8,-78);ctx.lineTo(-4,-92);ctx.lineTo(4,-80);ctx.lineTo(10,-90);ctx.lineTo(8,-76);ctx.lineTo(18,-88);ctx.lineTo(14,-74);ctx.lineTo(20,-82);ctx.lineTo(14,-68);ctx.lineTo(10,-72);ctx.closePath();ctx.fill();ctx.stroke();

  // === ZANPAKUTO (large sword, held over right shoulder) ===
  ctx.save();
  ctx.translate(28,-20);ctx.rotate(-.45);
  // Massive blade
  ctx.fillStyle='#000820';ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5,65);ctx.lineTo(5,65);ctx.closePath();ctx.fill();ctx.stroke();
  // Blade center line
  ctx.strokeStyle='rgba(147,197,253,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,63);ctx.stroke();
  // Tsuba (guard) - rectangular
  ctx.fillStyle='#000a20';ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(-10,-4,20,7,2);ctx.fill();ctx.stroke();
  // Tsuka (handle) with wrapping
  ctx.fillStyle='#000820';ctx.strokeStyle='#3b82f6';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(-3,-22,6,20,1);ctx.fill();ctx.stroke();
  // Diamond pattern on handle
  for(var i=0;i<4;i++){
    ctx.strokeStyle='rgba(59,130,246,.3)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(-3,-20+i*5);ctx.lineTo(3,-18+i*5);ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

// === LIGHTNING (small, under feet only) ===
function drawFootLightning(x,y,w){
  ctx.save();ctx.translate(x,y);
  var boltColor='rgba(168,85,247,';
  // Glow
  var g=ctx.createRadialGradient(0,0,0,0,0,w*.4);
  g.addColorStop(0,'rgba(168,85,247,.4)');g.addColorStop(.5,'rgba(168,85,247,.1)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w*.4,0,Math.PI*2);ctx.fill();

  // Crackling lines
  for(var i=0;i<4;i++){
    var phase=t*.008+i*1.5;
    ctx.strokeStyle=boltColor+(.5+.3*Math.sin(phase))+')';ctx.lineWidth=1.5;
    ctx.beginPath();
    var sx=-(w*.3)+Math.random()*w*.6,sy=-(w*.05);
    ctx.moveTo(sx,sy);
    for(var j=0;j<8;j++){
      sx+=(Math.random()-.5)*w*.25;
      sy+=(Math.random()-.3)*w*.15;
      ctx.lineTo(sx,sy);
    }
    ctx.stroke();
  }
  // White-hot sparks
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(var i=0;i<5;i++){
    ctx.beginPath();ctx.arc((Math.random()-.5)*w*.4,(Math.random()-.2)*w*.2,1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// Particles
var particles=[];
for(var i=0;i<120;i++){
  particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2-.1,r:Math.random()*1+.2,o:Math.random()*.4+.1,life:Math.random()*200});
}

// Ember particles for red side
var embers=[];
for(var i=0;i<40;i++){
  embers.push({x:Math.random()*W*.35,y:Math.random()*H,vx:(Math.random()-.3)*.3,vy:-Math.random()*1-.3,r:Math.random()*1.5+.5,o:Math.random()*.5+.2,life:Math.random()*100,phase:Math.random()*Math.PI*2});
}

// Blue sparks
var sparks=[];
for(var i=0;i<40;i++){
  sparks.push({x:W*.65+Math.random()*W*.35,y:Math.random()*H,vx:Math.random()*.3-.5,vy:Math.random()*1-.3,r:Math.random()*1.5+.5,o:Math.random()*.5+.2,life:Math.random()*100,phase:Math.random()*Math.PI*2});
}

function drawFrame(ts){
  t=ts;
  if(W!==c.width||H!==c.height)R();

  ctx.clearRect(0,0,W,H);

  // Deep space gradient
  var bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.8);
  bg.addColorStop(0,'#050510');bg.addColorStop(.6,'#020208');bg.addColorStop(1,'#000');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Stars
  particles.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.x<0||p.x>W||p.y<0||p.y>H||p.life<=0){p.x=Math.random()*W;p.y=Math.random()*H;p.life=200+Math.random()*200;}
    var blink=.5+.5*Math.sin(t*.004+p.life*.01);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(p.o*blink)+')';ctx.fill();
  });

  // Red ember particles (left side)
  embers.forEach(function(e){
    e.y+=e.vy;e.x+=e.vx;e.life--;
    if(e.y<0||e.life<=0){e.x=Math.random()*W*.4;e.y=H+10;e.life=100+Math.random()*100;var a=Math.random()*Math.PI*2;e.vx=Math.cos(a)*.5;e.vy=-1-Math.random()*2;}
    var pulse=.6+.4*Math.sin(t*.01+e.phase);
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle='rgba(239,68,68,'+(e.o*pulse)+')';ctx.fill();
  });

  // Blue spark particles (right side)
  sparks.forEach(function(s){
    s.y-=s.vy;s.x+=s.vx;s.life--;
    if(s.y<0||s.life<=0){s.x=W*.6+Math.random()*W*.4;s.y=H+10;s.life=100+Math.random()*100;var a=Math.random()*Math.PI*2;s.vx=Math.cos(a)*.5;s.vy=1+Math.random()*2;}
    var pulse=.6+.4*Math.sin(t*.01+s.phase);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(59,130,246,'+(s.o*pulse)+')';ctx.fill();
  });

  // Center subtle divider glow
  var divider=ctx.createLinearGradient(W*.48,0,W*.52,0);
  divider.addColorStop(0,'transparent');divider.addColorStop(.5,'rgba(168,85,247,.06)');divider.addColorStop(1,'transparent');
  ctx.fillStyle=divider;ctx.fillRect(W*.48,0,W*.04,H);

  // Warrior positions
  var warriorY=H*.72;
  var leftX=W*.32;
  var rightX=W*.68;
  var scale=Math.min(1.2,W/800);

  // Draw lightning under feet
  var flickerAlpha=.5+.3*Math.sin(t*.006);
  ctx.globalAlpha=flickerAlpha;
  drawFootLightning(leftX,warriorY+25,90);
  drawFootLightning(rightX,warriorY+25,90);
  ctx.globalAlpha=1;

  // Draw warriors
  drawKirito(leftX,warriorY,scale);
  drawIchigo(rightX,warriorY,scale);

  // Lightning tick counter
  lightningTick++;

  requestAnimationFrame(drawFrame);
}

requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
