<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020208}
body{background:var(--bg);color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}

.cosmos{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--del);opacity:var(--op)}
@keyframes twinkle{0%,100%{opacity:var(--op)}50%{opacity:calc(var(--op)*3)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.realms{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:2rem;justify-content:center;align-items:center;padding:2rem;max-width:900px}
.realm{display:flex;flex-direction:column;align-items:center;gap:1rem;text-decoration:none;cursor:pointer;transition:transform .4s cubic-bezier(.16,1,.3,1),filter .4s;animation:float var(--ft,6s) ease-in-out infinite;animation-delay:var(--fd,0s);filter:grayscale(0.4)}
.realm:hover{transform:scale(1.12);filter:grayscale(0);z-index:5}
.realm:active{transform:scale(0.97)}

.realm-orb{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;transition:box-shadow .4s}
.realm:hover .realm-orb{box-shadow:var(--glow)}

.fire .realm-orb{background:radial-gradient(circle at 40% 40%,#f97316,#7c2d12);--glow:0 0 60px rgba(249,115,22,.5),0 0 120px rgba(249,115,22,.2)}
.water .realm-orb{background:radial-gradient(circle at 40% 40%,#38bdf8,#1e3a5f);--glow:0 0 60px rgba(56,189,248,.5),0 0 120px rgba(56,189,248,.2)}
.ice .realm-orb{background:radial-gradient(circle at 40% 40%,#e0f2fe,#64748b);--glow:0 0 60px rgba(224,242,254,.5),0 0 120px rgba(224,242,254,.2)}
.lightning .realm-orb{background:radial-gradient(circle at 40% 40%,#facc15,#854d0e);--glow:0 0 60px rgba(250,204,21,.5),0 0 120px rgba(250,204,21,.2)}
.void .realm-orb{background:radial-gradient(circle at 40% 40%,#a78bfa,#1e1b4b);--glow:0 0 60px rgba(167,139,250,.4),0 0 120px rgba(167,139,250,.15)}

.realm-orb::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid transparent;transition:border-color .4s}
.realm:hover .realm-orb::after{border-color:rgba(255,255,255,.2)}

.realm-label{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;transition:color .3s}
.fire .realm-label{color:#fb923c}
.water .realm-label{color:#38bdf8}
.ice .realm-label{color:#e0f2fe}
.lightning .realm-label{color:#facc15}
.void .realm-label{color:#a78bfa}

.realm-name{font-size:1.1rem;font-weight:700;letter-spacing:.06em;transition:color .3s,text-shadow .3s}
.fire .realm-name{color:#ea580c}
.water .realm-name{color:#0ea5e9}
.ice .realm-name{color:#bae6fd}
.lightning .realm-name{color:#eab308}
.void .realm-name{color:#7c3aed}

.realm:hover .realm-name{text-shadow:0 0 20px currentColor}

.realm-sub{font-size:.6rem;color:#52525b;letter-spacing:.08em;text-align:center;max-width:110px;transition:color .3s}
.realm:hover .realm-sub{color:#a1a1aa}

.tag{position:fixed;bottom:2rem;left:0;right:0;text-align:center;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:#27272a;z-index:1}

@media(max-width:600px){
  .realms{gap:1.25rem;padding:1rem}
  .realm-orb{width:64px;height:64px;font-size:1.4rem}
  .realm-name{font-size:.9rem}
  .realm-label{font-size:.6rem}
}
</style>
</head>
<body>

<div class="cosmos" id="stars"></div>

<div class="realms">

  <a href="/fire" class="realm fire" style="--fd:0s;--ft:5.5s">
    <div class="realm-orb">&#x1F525;</div>
    <span class="realm-label">Element I</span>
    <span class="realm-name">Fire</span>
    <span class="realm-sub">Leo · About me · Introduction</span>
  </a>

  <a href="/water" class="realm water" style="--fd:0.8s;--ft:6s">
    <div class="realm-orb">&#x1F4A7;</div>
    <span class="realm-label">Element II</span>
    <span class="realm-name">Water</span>
    <span class="realm-sub">My tools · What I've built</span>
  </a>

  <a href="/ice" class="realm ice" style="--fd:1.6s;--ft:5.8s">
    <div class="realm-orb">&#x2744;</div>
    <span class="realm-label">Element III</span>
    <span class="realm-name">Ice</span>
    <span class="realm-sub">Creativity · Vent · Raw thoughts</span>
  </a>

  <a href="/lightning" class="realm lightning" style="--fd:2.4s;--ft:6.2s">
    <div class="realm-orb">&#x26A1;</div>
    <span class="realm-label">Element IV</span>
    <span class="realm-name">Thunder</span>
    <span class="realm-sub">Ambitions · Goals · Current</span>
  </a>

  <a href="/darkness" class="realm void" style="--fd:3.2s;--ft:5.7s">
    <div class="realm-orb">&#x1F319;</div>
    <span class="realm-label">Element V</span>
    <span class="realm-name">Void</span>
    <span class="realm-sub">Admiration · Thanks · Regards</span>
  </a>

</div>

<span class="tag">choose your element</span>

<script>
// Stars
(function(){var s=document.getElementById('stars');var h='';for(var i=0;i<200;i++){var x=Math.random()*100;var y=Math.random()*100;var d=2+Math.random()*4;var del=Math.random()*5;var op=.2+Math.random()*.5;h+='<div class="star" style="left:'+x+'%;top:'+y+'%;--d:'+d+'s;--del:'+del+'s;--op:'+op+'"></div>'}s.innerHTML=h})();
</script>

</body>
</html>
