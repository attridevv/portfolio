<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh}
canvas{display:block;position:fixed;inset:0}

.overlay{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex}
.zone{flex:1;cursor:pointer;pointer-events:auto;position:relative;text-decoration:none;transition:background .5s}
.zone-l:hover{background:radial-gradient(ellipse at 30% 50%,rgba(239,68,68,.06),transparent 70%)}
.zone-r:hover{background:radial-gradient(ellipse at 70% 50%,rgba(59,130,246,.06),transparent 70%)}
.zone:hover .zone-hint{opacity:1;transform:translateX(-50%)translateY(-6px)}

.zone-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:all .5s;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.zone-l .zone-hint{color:#fca5a5}.zone-r .zone-hint{color:#93c5fd}
.zone-hint .l1{display:block;font-size:.5rem;letter-spacing:.25em;text-transform:uppercase;font-weight:800;margin-bottom:.1rem}
.zone-hint .l2{display:block;font-size:.85rem;font-weight:900;letter-spacing:.08em}
.zone-hint .l3{display:block;font-size:.38rem;letter-spacing:.14em;margin-top:.1rem;opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay">
  <a href="/fire" class="zone zone-l"><div class="zone-hint"><span class="l1">The Self</span><span class="l2">ABOUT</span><span class="l3">Leo &middot; Identity &middot; Fire</span></div></a>
  <a href="/water" class="zone zone-r"><div class="zone-hint"><span class="l1">The Work</span><span class="l2">CREATE</span><span class="l3">Tools &middot; Builds &middot; Output</span></div></a>
</div>

<script>
(function(){
var c=document.getElementById('c'),ctx=c.getContext('2d');
var W,H,t=0;

function R(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
R();window.addEventListener('resize',R);

// ==================== FIRE DRAGON (left) ====================
function drawFireDragon(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  
  // Body glow
  for(var g=0;g<3;g++){
    var grad=ctx.createRadialGradient(0,0,20,0,0,80+g*20);
    grad.addColorStop(0,'rgba(249,115,22,'+(.12-g*.03)+')');
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,80+g*20,0,Math.PI*2);ctx.fill();
  }

  // Serpentine dragon body
  ctx.fillStyle='#1a0500';ctx.strokeStyle='rgba(249,115,22,.4)';ctx.lineWidth=2;
  ctx.beginPath();
  // Tail (bottom left, sweeping up)
  ctx.moveTo(-55,20);
  ctx.bezierCurveTo(-65,5,-50,-15,-35,-25);
  ctx.bezierCurveTo(-20,-35,-10,-20,0,-30);
  ctx.bezierCurveTo(10,-40,25,-25,35,-35);
  ctx.bezierCurveTo(45,-45,50,-30,55,-20);
  // Head at top
  ctx.lineTo(58,-25);
  ctx.bezierCurveTo(62,-30,65,-22,60,-15);
  ctx.lineTo(55,-10);
  // Neck down
  ctx.bezierCurveTo(45,-5,40,0,30,5);
  ctx.bezierCurveTo(20,10,10,0,0,5);
  ctx.bezierCurveTo(-10,10,-20,0,-30,5);
  ctx.bezierCurveTo(-40,10,-45,20,-55,20);
  ctx.fill();ctx.stroke();

  // Scales - small strokes along body
  ctx.strokeStyle='rgba(249,115,22,.25)';ctx.lineWidth=.8;
  for(var i=0;i<12;i++){
    var px=-45+i*13,py=-15+Math.sin(i*.8)*8;
    ctx.beginPath();ctx.moveTo(px-2,py);ctx.lineTo(px+3,py-3);ctx.stroke();
  }

  // Spines along back
  ctx.fillStyle='rgba(239,68,68,.4)';ctx.strokeStyle='rgba(239,68,68,.6)';ctx.lineWidth=1;
  for(var i=0;i<8;i++){
    var sx=-40+i*15,sy=-20+Math.sin(i*.6)*8;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-4,sy-18);ctx.lineTo(sx+4,sy-14);ctx.closePath();ctx.fill();ctx.stroke();
  }

  // Head details
  ctx.fillStyle='#1a0500';ctx.strokeStyle='rgba(249,115,22,.6)';ctx.lineWidth=2;
  // Snout
  ctx.beginPath();ctx.moveTo(55,-20);ctx.lineTo(75,-25);ctx.lineTo(72,-18);ctx.lineTo(58,-15);ctx.closePath();ctx.fill();ctx.stroke();
  // Jaw
  ctx.beginPath();ctx.moveTo(58,-15);ctx.lineTo(70,-10);ctx.lineTo(65,-5);ctx.lineTo(55,-10);ctx.closePath();ctx.fill();ctx.stroke();
  // Eye
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(52,-22,3,0,Math.PI*2);ctx.fill();
  // Horns
  ctx.fillStyle='rgba(251,191,36,.5)';ctx.strokeStyle='#f97316';
  ctx.beginPath();ctx.moveTo(58,-25);ctx.lineTo(72,-45);ctx.lineTo(65,-40);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(60,-20);ctx.lineTo(76,-38);ctx.lineTo(68,-34);ctx.closePath();ctx.fill();ctx.stroke();
  
  // Fire breath
  for(var f=0;f<5;f++){
    var fx=75+Math.random()*15,fy=-22+(Math.random()-.5)*15;
    ctx.fillStyle='rgba(251,191,36,'+(.3+Math.random()*.4)+')';
    ctx.beginPath();ctx.arc(fx,fy,3+Math.random()*5,0,Math.PI*2);ctx.fill();
  }
  // Flame tongue
  ctx.fillStyle='rgba(251,191,36,.5)';ctx.strokeStyle='#f97316';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(73,-18);ctx.lineTo(88,-22);ctx.lineTo(85,-14);ctx.lineTo(75,-13);ctx.closePath();ctx.fill();ctx.stroke();

  // Wing (folded, behind)
  ctx.fillStyle='rgba(124,45,18,.3)';ctx.strokeStyle='rgba(249,115,22,.25)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-40,-80);ctx.lineTo(-20,-60);ctx.lineTo(-35,-70);ctx.lineTo(-15,-50);ctx.lineTo(-5,-45);ctx.closePath();ctx.fill();ctx.stroke();
  // Wing ribs
  ctx.strokeStyle='rgba(249,115,22,.2)';ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-35,-65);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-20,-55);ctx.stroke();

  ctx.restore();
}

// ==================== ICE DRAGON (right) ====================
function drawIceDragon(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Body glow
  for(var g=0;g<3;g++){
    var grad=ctx.createRadialGradient(0,0,20,0,0,80+g*20);
    grad.addColorStop(0,'rgba(56,189,248,'+(.1-g*.025)+')');
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,80+g*20,0,Math.PI*2);ctx.fill();
  }

  // Serpentine body
  ctx.fillStyle='#000a14';ctx.strokeStyle='rgba(56,189,248,.4)';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(55,20);
  ctx.bezierCurveTo(65,5,50,-15,35,-25);
  ctx.bezierCurveTo(20,-35,10,-20,0,-30);
  ctx.bezierCurveTo(-10,-40,-25,-25,-35,-35);
  ctx.bezierCurveTo(-45,-45,-50,-30,-55,-20);
  ctx.lineTo(-58,-25);
  ctx.bezierCurveTo(-62,-30,-65,-22,-60,-15);
  ctx.lineTo(-55,-10);
  ctx.bezierCurveTo(-45,-5,-40,0,-30,5);
  ctx.bezierCurveTo(-20,10,-10,0,0,5);
  ctx.bezierCurveTo(10,10,20,0,30,5);
  ctx.bezierCurveTo(40,10,45,20,55,20);
  ctx.fill();ctx.stroke();

  // Ice crystal scales
  ctx.fillStyle='rgba(186,230,253,.15)';ctx.strokeStyle='rgba(56,189,248,.2)';ctx.lineWidth=.8;
  for(var i=0;i<10;i++){
    var px=-45+i*13,py=-18+Math.sin(i*.7)*7;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+4,py-5);ctx.lineTo(px+8,py);ctx.lineTo(px+4,py+3);ctx.closePath();ctx.fill();ctx.stroke();
  }

  // Crystal spines
  ctx.fillStyle='rgba(186,230,253,.3)';ctx.strokeStyle='rgba(147,197,253,.5)';ctx.lineWidth=1;
  for(var i=0;i<8;i++){
    var sx=-40+i*15,sy=-20+Math.sin(i*.6)*8;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-3,sy-20);ctx.lineTo(sx+5,sy-16);ctx.closePath();ctx.fill();ctx.stroke();
  }

  // Head
  ctx.fillStyle='#000a14';ctx.strokeStyle='rgba(56,189,248,.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-55,-20);ctx.lineTo(-75,-25);ctx.lineTo(-72,-18);ctx.lineTo(-58,-15);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-58,-15);ctx.lineTo(-70,-10);ctx.lineTo(-65,-5);ctx.lineTo(-55,-10);ctx.closePath();ctx.fill();ctx.stroke();
  // Eye
  ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(-52,-22,3,0,Math.PI*2);ctx.fill();
  // Horns (ice crystal shape)
  ctx.fillStyle='rgba(186,230,253,.4)';ctx.strokeStyle='#7dd3fc';
  ctx.beginPath();ctx.moveTo(-58,-25);ctx.lineTo(-72,-48);ctx.lineTo(-64,-42);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-60,-20);ctx.lineTo(-76,-40);ctx.lineTo(-68,-36);ctx.closePath();ctx.fill();ctx.stroke();

  // Frost breath
  for(var f=0;f<5;f++){
    var fx=-75-Math.random()*15,fy=-22+(Math.random()-.5)*15;
    ctx.fillStyle='rgba(186,230,253,'+(.25+Math.random()*.35)+')';
    ctx.beginPath();ctx.arc(fx,fy,3+Math.random()*4,0,Math.PI*2);ctx.fill();
  }

  // Wing (folded, behind)
  ctx.fillStyle='rgba(12,74,110,.25)';ctx.strokeStyle='rgba(56,189,248,.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(10,-30);ctx.lineTo(40,-84);ctx.lineTo(20,-62);ctx.lineTo(35,-72);ctx.lineTo(15,-52);ctx.lineTo(5,-45);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(56,189,248,.15)';ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(10,-30);ctx.lineTo(35,-68);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-30);ctx.lineTo(20,-58);ctx.stroke();

  ctx.restore();
}

// ==================== KIRITO (red, dual swords) ====================
function drawKirito(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Aura
  var a=ctx.createRadialGradient(0,-5,10,0,-5,100);
  a.addColorStop(0,'rgba(239,68,68,.2)');a.addColorStop(.5,'rgba(239,68,68,.04)');a.addColorStop(1,'transparent');
  ctx.fillStyle=a;ctx.beginPath();ctx.arc(0,-10,100,0,Math.PI*2);ctx.fill();

  var b='#080002';var e='rgba(239,68,68,.3)';

  // === LEGS ===
  ctx.fillStyle=b;ctx.strokeStyle=e;ctx.lineWidth=.8;
  // Left
  ctx.beginPath();ctx.moveTo(-6,-5);ctx.lineTo(-10,28);ctx.lineTo(-4,30);ctx.lineTo(-2,-5);ctx.fill();ctx.stroke();
  // Right
  ctx.beginPath();ctx.moveTo(6,-5);ctx.lineTo(10,28);ctx.lineTo(4,30);ctx.lineTo(2,-5);ctx.fill();ctx.stroke();
  // Boots
  ctx.fillStyle='#100002';ctx.strokeStyle='rgba(239,68,68,.4)';
  ctx.beginPath();ctx.moveTo(-12,26);ctx.lineTo(-12,34);ctx.lineTo(12,34);ctx.lineTo(10,26);ctx.lineTo(-10,26);ctx.closePath();ctx.fill();ctx.stroke();

  // === LONG BLACK COAT ===
  ctx.fillStyle='#040001';ctx.strokeStyle=e;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-14,-30);ctx.lineTo(-17,-5);ctx.lineTo(-15,12);ctx.lineTo(-10,24);ctx.lineTo(-4,6);ctx.lineTo(0,8);ctx.lineTo(4,6);ctx.lineTo(10,24);ctx.lineTo(15,12);ctx.lineTo(17,-5);ctx.lineTo(14,-30);ctx.closePath();ctx.fill();ctx.stroke();
  // Coat center line
  ctx.strokeStyle='rgba(239,68,68,.12)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(0,6);ctx.stroke();

  // === SILVER TRIM on coat === 
  ctx.strokeStyle='rgba(252,165,165,.2)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(-14,-30);ctx.lineTo(14,-30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-15,12);ctx.lineTo(15,12);ctx.stroke();

  // === TORSO ===
  ctx.fillStyle='#0a0003';ctx.strokeStyle=e;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-11,-45);ctx.lineTo(-14,-30);ctx.lineTo(-10,-18);ctx.lineTo(10,-18);ctx.lineTo(14,-30);ctx.lineTo(11,-45);ctx.closePath();ctx.fill();ctx.stroke();
  // Cross pin on chest
  ctx.strokeStyle='rgba(252,165,165,.3)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-4,-38);ctx.lineTo(4,-32);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,-38);ctx.lineTo(-4,-32);ctx.stroke();

  // === SHOULDER GUARDS ===
  ctx.fillStyle='#0a0003';ctx.strokeStyle='rgba(239,68,68,.45)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-13,-47);ctx.lineTo(-20,-42);ctx.lineTo(-24,-36);ctx.lineTo(-17,-33);ctx.lineTo(-10,-42);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(13,-47);ctx.lineTo(20,-42);ctx.lineTo(24,-36);ctx.lineTo(17,-33);ctx.lineTo(10,-42);ctx.closePath();ctx.fill();ctx.stroke();

  // === ARMS ===
  ctx.fillStyle=b;ctx.strokeStyle=e;ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-16,-40);ctx.lineTo(-22,-26);ctx.lineTo(-18,-24);ctx.lineTo(-12,-38);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,-40);ctx.lineTo(22,-26);ctx.lineTo(18,-24);ctx.lineTo(12,-38);ctx.fill();ctx.stroke();

  // === NECK ===
  ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(-4,-45);ctx.lineTo(-3,-52);ctx.lineTo(3,-52);ctx.lineTo(4,-45);ctx.fill();

  // === HEAD ===
  ctx.fillStyle='#0a0005';ctx.strokeStyle=e;ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,-62,8,10,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Chin definition
  ctx.strokeStyle='rgba(239,68,68,.15)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(-4,-56);ctx.lineTo(0,-54);ctx.lineTo(4,-56);ctx.stroke();
  // Eyes (glowing)
  ctx.fillStyle='#ef4444';ctx.shadowColor='rgba(239,68,68,.5)';ctx.shadowBlur=3;
  ctx.beginPath();ctx.ellipse(-3,-64,2,1.2,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(3,-64,2,1.2,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // === KIRITO HAIR (messy, spiky) ===
  ctx.fillStyle='#050001';ctx.strokeStyle='rgba(239,68,68,.25)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-7,-70);ctx.lineTo(-12,-83);ctx.lineTo(-5,-78);ctx.lineTo(-1,-90);ctx.lineTo(4,-79);ctx.lineTo(10,-88);ctx.lineTo(7,-76);ctx.lineTo(14,-82);ctx.lineTo(9,-70);ctx.lineTo(7,-72);ctx.closePath();ctx.fill();ctx.stroke();
  // Side hair tufts
  ctx.beginPath();ctx.moveTo(-7,-68);ctx.lineTo(-14,-74);ctx.lineTo(-8,-70);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-68);ctx.lineTo(14,-74);ctx.lineTo(8,-70);ctx.closePath();ctx.fill();ctx.stroke();

  // === ELUCIDATOR (dark sword, right hand) ===
  ctx.save();ctx.translate(18,-28);ctx.rotate(-.6);
  ctx.fillStyle='#0a0003';ctx.strokeStyle='#ef4444';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-2.5,42);ctx.lineTo(2.5,42);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(252,165,165,.4)';ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,40);ctx.stroke();
  // Guard
  ctx.fillStyle='#1a0005';ctx.strokeStyle='#ef4444';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(-7,-3,14,5,2);ctx.fill();ctx.stroke();
  // Handle
  ctx.fillStyle='#0a0003';ctx.beginPath();ctx.roundRect(-2,-14,4,13,1);ctx.fill();
  ctx.strokeStyle='rgba(252,165,165,.2)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(-1,-12);ctx.lineTo(1,-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-1,-7);ctx.lineTo(1,-7);ctx.stroke();
  ctx.restore();

  // === DARK REPULSER (light sword, left hand) ===
  ctx.save();ctx.translate(-18,-28);ctx.rotate(-2.5);
  ctx.fillStyle='#050010';ctx.strokeStyle='#93c5fd';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-2,38);ctx.lineTo(2,38);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(191,219,254,.5)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,36);ctx.stroke();
  ctx.fillStyle='#0a0020';ctx.strokeStyle='#93c5fd';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(-6,-3,12,5,2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#050010';ctx.beginPath();ctx.roundRect(-2,-12,4,11,1);ctx.fill();
  ctx.restore();

  ctx.restore();
}

// ==================== ICHIGO (blue, zanpakuto) ====================
function drawIchigo(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

  // Aura
  var a=ctx.createRadialGradient(0,-5,10,0,-5,100);
  a.addColorStop(0,'rgba(59,130,246,.2)');a.addColorStop(.5,'rgba(59,130,246,.04)');a.addColorStop(1,'transparent');
  ctx.fillStyle=a;ctx.beginPath();ctx.arc(0,-10,100,0,Math.PI*2);ctx.fill();

  var b='#000610';var e='rgba(59,130,246,.3)';

  // === LEGS (wide stance) ===
  ctx.fillStyle=b;ctx.strokeStyle=e;ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(-12,28);ctx.lineTo(-5,30);ctx.lineTo(-2,-5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-5);ctx.lineTo(12,28);ctx.lineTo(5,30);ctx.lineTo(2,-5);ctx.fill();ctx.stroke();

  // === SHIHAKUSHO ROBE ===
  ctx.fillStyle='#000510';ctx.strokeStyle=e;ctx.lineWidth=1;
  // Wide hakama pants
  ctx.beginPath();ctx.moveTo(-16,-12);ctx.lineTo(-22,8);ctx.lineTo(-14,24);ctx.lineTo(-5,10);ctx.lineTo(0,12);ctx.lineTo(5,10);ctx.lineTo(14,24);ctx.lineTo(22,8);ctx.lineTo(16,-12);ctx.closePath();ctx.fill();ctx.stroke();
  // Pleats in hakama
  ctx.strokeStyle='rgba(59,130,246,.08)';ctx.lineWidth=.4;
  ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(-6,8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-12);ctx.lineTo(6,8);ctx.stroke();

  // === KIMONO TOP ===
  ctx.fillStyle='#00081a';ctx.strokeStyle=e;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-14,-48);ctx.lineTo(-16,-12);ctx.lineTo(-8,-2);ctx.lineTo(8,-2);ctx.lineTo(16,-12);ctx.lineTo(14,-48);ctx.closePath();ctx.fill();ctx.stroke();
  // V-neck opening
  ctx.strokeStyle='rgba(59,130,246,.1)';ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(-4,-18);ctx.lineTo(0,-12);ctx.lineTo(4,-18);ctx.lineTo(0,-30);ctx.stroke();
  
  // === OBI (sash) ===
  ctx.fillStyle='#000a20';ctx.strokeStyle='rgba(59,130,246,.45)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-15,-12);ctx.lineTo(15,-12);ctx.lineTo(14,-6);ctx.lineTo(-14,-6);ctx.closePath();ctx.fill();ctx.stroke();
  // Obi knot at back
  ctx.fillStyle='#000820';ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(6,-6);ctx.lineTo(8,2);ctx.lineTo(-8,2);ctx.closePath();ctx.fill();ctx.stroke();

  // === ARMS ===
  ctx.fillStyle=b;ctx.strokeStyle=e;ctx.lineWidth=.8;
  // Left arm (forward, ready)
  ctx.beginPath();ctx.moveTo(-15,-42);ctx.lineTo(-20,-30);ctx.lineTo(-26,-22);ctx.lineTo(-22,-18);ctx.lineTo(-16,-28);ctx.fill();ctx.stroke();
  // Right arm (back, holding sword)
  ctx.beginPath();ctx.moveTo(15,-42);ctx.lineTo(20,-32);ctx.lineTo(28,-24);ctx.lineTo(26,-20);ctx.lineTo(18,-28);ctx.fill();ctx.stroke();

  // === SHOULDERS ===
  ctx.fillStyle='#00081a';ctx.strokeStyle=e;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-16,-50);ctx.lineTo(-22,-42);ctx.lineTo(-26,-36);ctx.lineTo(-18,-32);ctx.lineTo(-12,-40);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,-50);ctx.lineTo(22,-42);ctx.lineTo(26,-36);ctx.lineTo(18,-32);ctx.lineTo(12,-40);ctx.closePath();ctx.fill();ctx.stroke();

  // === NECK ===
  ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(-5,-48);ctx.lineTo(-4,-54);ctx.lineTo(4,-54);ctx.lineTo(5,-48);ctx.fill();

  // === HEAD ===
  ctx.fillStyle='#000610';ctx.strokeStyle=e;ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,-64,8,10,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Jaw
  ctx.strokeStyle='rgba(59,130,246,.12)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(-5,-58);ctx.lineTo(0,-56);ctx.lineTo(5,-58);ctx.stroke();
  // Eyes
  ctx.fillStyle='#3b82f6';ctx.shadowColor='rgba(59,130,246,.5)';ctx.shadowBlur=3;
  ctx.beginPath();ctx.ellipse(-3,-66,2,1.2,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(3,-66,2,1.2,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // === ICHIGO HAIR (wild, tall spikes) ===
  ctx.fillStyle='#000510';ctx.strokeStyle='rgba(59,130,246,.25)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-8,-72);ctx.lineTo(-16,-88);ctx.lineTo(-10,-82);ctx.lineTo(-5,-96);ctx.lineTo(2,-84);ctx.lineTo(8,-94);ctx.lineTo(6,-80);ctx.lineTo(14,-90);ctx.lineTo(12,-78);ctx.lineTo(18,-86);ctx.lineTo(14,-72);ctx.lineTo(10,-74);ctx.closePath();ctx.fill();ctx.stroke();

  // === ZANGETSU (massive cleaver sword) ===
  ctx.save();ctx.translate(24,-26);ctx.rotate(-.5);
  // Huge blade - like a giant butcher knife
  ctx.fillStyle='#000820';ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-10,55);ctx.lineTo(10,55);ctx.lineTo(4,0);ctx.closePath();ctx.fill();ctx.stroke();
  // Blade edge highlight
  ctx.strokeStyle='rgba(147,197,253,.35)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(-8,5);ctx.lineTo(-5,52);ctx.stroke();
  // Center ridge
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,53);ctx.stroke();
  // Tip curve
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-10,55);ctx.quadraticCurveTo(0,62,10,55);ctx.stroke();
  // Tsuba (guard) - rectangular
  ctx.fillStyle='#000a20';ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(-12,-3,24,6,2);ctx.fill();ctx.stroke();
  // Tsuka with diamond wrap
  ctx.fillStyle='#000820';ctx.strokeStyle='#3b82f6';ctx.lineWidth=.8;
  ctx.beginPath();ctx.roundRect(-3,-22,6,20,1);ctx.fill();ctx.stroke();
  for(var i=0;i<5;i++){
    ctx.strokeStyle='rgba(59,130,246,.2)';ctx.lineWidth=.4;
    ctx.beginPath();ctx.moveTo(-3,-19+i*4);ctx.lineTo(3,-17+i*4);ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

// ==================== SKY LIGHTNING ====================
var lightningHistory=[];
function generateLightningBolt(){
  var bolts=[];
  var cx=W/2+(Math.random()-.5)*W*.3;
  var cy=H*.02;
  // Main bolt
  var pts=[{x:cx,y:cy}];
  var x=cx,y=cy,steps=30;
  for(var i=0;i<steps;i++){
    x+=(Math.random()-.5)*35;
    y+=15+Math.random()*20;
    pts.push({x:x,y:y});
    if(Math.random()<.2&&i>5){
      var forkPts=[{x:x,y:y}];
      var fx=x,fy=y;
      for(var j=0;j<12;j++){fx+=(Math.random()-.5)*25;fy+=8+Math.random()*15;forkPts.push({x:fx,y:fy})}
      pts.push({fork:forkPts});
    }
  }
  bolts.push({pts:pts,alpha:1,life:60});
  return bolts;
}

function drawSkyLightning(bolts){
  if(!bolts)return;
  bolts.forEach(function(b){
    b.life--;
    var a=b.alpha*(b.life/60);
    // Outer glow
    ctx.strokeStyle='rgba(168,85,247,'+(a*.25)+')';ctx.lineWidth=10;ctx.lineCap='round';
    ctx.shadowColor='rgba(168,85,247,'+(a*.5)+')';ctx.shadowBlur=25;
    ctx.beginPath();drawLPath(b.pts);ctx.stroke();
    // Purple core
    ctx.strokeStyle='rgba(192,132,252,'+(a*.5)+')';ctx.lineWidth=4;
    ctx.shadowBlur=15;
    ctx.beginPath();drawLPath(b.pts);ctx.stroke();
    // White center
    ctx.strokeStyle='rgba(255,255,255,'+(a*.7)+')';ctx.lineWidth=1.5;
    ctx.shadowBlur=6;
    ctx.beginPath();drawLPath(b.pts);ctx.stroke();
    ctx.shadowBlur=0;
  });
}

function drawLPath(pts){
  ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++){
    if(pts[i].fork){ctx.lineTo(pts[i-1].x,pts[i-1].y);drawLPath(pts[i].fork);ctx.moveTo(pts[i-1].x,pts[i-1].y)}
    else ctx.lineTo(pts[i].x,pts[i].y);
  }
}

// Foot lightning
function drawFootLightning(x,y,s){
  ctx.save();ctx.translate(x,y);
  var g=ctx.createRadialGradient(0,0,0,0,0,s*.5);
  g.addColorStop(0,'rgba(168,85,247,.35)');g.addColorStop(.5,'rgba(168,85,247,.08)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fill();
  for(var i=0;i<5;i++){
    ctx.strokeStyle='rgba(192,132,252,'+(.4+.3*Math.sin(t*.01+i*1.3))+')';ctx.lineWidth=1.2;
    ctx.beginPath();var sx=-(s*.3)+Math.random()*s*.6,sy=-(s*.1);
    ctx.moveTo(sx,sy);
    for(var j=0;j<6;j++){sx+=(Math.random()-.5)*s*.2;sy+=(Math.random()-.3)*s*.12;ctx.lineTo(sx,sy)}
    ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(var i=0;i<4;i++){ctx.beginPath();ctx.arc((Math.random()-.5)*s*.3,(Math.random()-.2)*s*.2,1.2,0,Math.PI*2);ctx.fill()}
  ctx.restore();
}

// Particles
var stars=[],embers=[],sparks=[];
for(var i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*.8+.2,o:Math.random()*.4+.1,p:Math.random()*Math.PI*2});
for(var i=0;i<50;i++)embers.push({x:Math.random()*W*.35,y:Math.random()*H,vx:(Math.random()-.3)*.4,vy:-Math.random()*1.5-.5,r:Math.random()*2+.5,o:Math.random()*.4+.15,l:Math.random()*120,ph:Math.random()*Math.PI*2});
for(var i=0;i<50;i++)sparks.push({x:W*.65+Math.random()*W*.35,y:Math.random()*H,vx:Math.random()*.4-.5,vy:-Math.random()*1.5-.5,r:Math.random()*2+.5,o:Math.random()*.4+.15,l:Math.random()*120,ph:Math.random()*Math.PI*2});

function drawFrame(ts){
  t=ts;
  if(W!==c.width||H!==c.height)R();

  ctx.clearRect(0,0,W,H);

  // Background
  var bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));
  bg.addColorStop(0,'#030308');bg.addColorStop(.7,'#010104');bg.addColorStop(1,'#000');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(function(s){var b=.5+.5*Math.sin(t*.003+s.p);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(s.o*b)+')';ctx.fill()});

  // Embers (left)
  embers.forEach(function(e){e.y+=e.vy;e.x+=e.vx;e.l--;if(e.y<0||e.l<=0){e.x=Math.random()*W*.35;e.y=H+10;e.l=120+Math.random()*100}var p=.5+.5*Math.sin(t*.012+e.ph);ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle='rgba(239,68,68,'+(e.o*p)+')';ctx.fill()});

  // Sparks (right)
  sparks.forEach(function(s){s.y+=s.vy;s.x+=s.vx;s.l--;if(s.y<0||s.l<=0){s.x=W*.65+Math.random()*W*.35;s.y=H+10;s.l=120+Math.random()*100}var p=.5+.5*Math.sin(t*.012+s.ph);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(59,130,246,'+(s.o*p)+')';ctx.fill()});

  // Subtle center glow
  var cglow=ctx.createLinearGradient(W*.47,0,W*.53,0);
  cglow.addColorStop(0,'transparent');cglow.addColorStop(.5,'rgba(168,85,247,.04)');cglow.addColorStop(1,'transparent');
  ctx.fillStyle=cglow;ctx.fillRect(W*.47,0,W*.06,H);

  // Sky lightning - generate periodically
  if(Math.random()<.02||lightningHistory.length===0){
    lightningHistory.push(generateLightningBolt());
    if(lightningHistory.length>4)lightningHistory.shift();
  }
  lightningHistory=lightningHistory.filter(function(b){return b[0].life>0});
  lightningHistory.forEach(function(b){drawSkyLightning(b)});

  // Positions
  var dragY=H*.70;
  var dragScalex=Math.min(1.3,W/750);
  var dragScaley=Math.min(1.3,W/750);
  var lx=W*.30,rx=W*.70;
  var warY=H*.52;
  var warS=Math.min(1.15,W/750);

  // Draw dragons
  drawFireDragon(lx,dragY,dragScalex*1.1);
  drawIceDragon(rx,dragY,dragScalex*1.1);

  // Foot lightning on dragons
  ctx.globalAlpha=.7+.2*Math.sin(t*.007);
  drawFootLightning(lx,dragY-30,90);
  drawFootLightning(rx,dragY-30,90);
  ctx.globalAlpha=1;

  // Warriors on dragons
  drawKirito(lx,dragY-55,warS*1.05);
  drawIchigo(rx,dragY-55,warS*1.05);

  requestAnimationFrame(drawFrame);
}

requestAnimationFrame(drawFrame);
})();
</script>
