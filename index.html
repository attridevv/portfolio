<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --red:#ef4444;--red-glow:rgba(239,68,68,.4);--red-deep:#1a0000;
  --blue:#3b82f6;--blue-glow:rgba(59,130,246,.4);--blue-deep:#000a1a;
  --purple:#a855f7;--purple-glow:rgba(168,85,247,.6);
}

body{
  background:#010104;color:#e2e8f0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  width:100vw;height:100vh;overflow:hidden;
}

/* Canvas background */
canvas#bg{position:fixed;inset:0;z-index:0}

/* Main stage */
.stage{position:fixed;inset:0;z-index:10;display:flex;pointer-events:none}
.stage>*{pointer-events:auto}

/* Left side - RED */
.side-red{
  flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;color:inherit;
  background:radial-gradient(ellipse at 85% 50%,rgba(239,68,68,.12),transparent 60%),
    linear-gradient(to right,var(--red-deep),rgba(80,0,0,.3));
  transition:all .6s cubic-bezier(.16,1,.3,1);
}
.side-red:hover{background:radial-gradient(ellipse at 85% 50%,rgba(239,68,68,.25),transparent 55%),
  linear-gradient(to right,#2a0000,rgba(120,0,0,.4));}
.side-red:hover .side-glow{opacity:1;transform:scaleX(1.1)}

/* Right side - BLUE */
.side-blue{
  flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;color:inherit;
  background:radial-gradient(ellipse at 15% 50%,rgba(59,130,246,.12),transparent 60%),
    linear-gradient(to left,var(--blue-deep),rgba(0,20,60,.3));
  transition:all .6s cubic-bezier(.16,1,.3,1);
}
.side-blue:hover{background:radial-gradient(ellipse at 15% 50%,rgba(59,130,246,.25),transparent 55%),
  linear-gradient(to left,#000a2a,rgba(0,40,100,.4));}
.side-blue:hover .side-glow{opacity:1;transform:scaleX(1.1)}

/* Glow bars at the divider edge */
.side-glow{
  position:absolute;top:0;bottom:0;width:3px;opacity:.4;transition:all .5s;
}
.side-red .side-glow{right:0;background:linear-gradient(to left,var(--red),transparent 60%);box-shadow:-8px 0 30px var(--red-glow),-20px 0 60px rgba(239,68,68,.15)}
.side-blue .side-glow{left:0;background:linear-gradient(to right,var(--blue),transparent 60%);box-shadow:8px 0 30px var(--blue-glow),20px 0 60px rgba(59,130,246,.15)}

/* Content on each side */
.side-content{position:relative;z-index:5;text-align:center;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.side-red:hover .side-content{transform:translateX(-8px)}
.side-blue:hover .side-content{transform:translateX(8px)}

.side-icon{font-size:3rem;display:block;margin-bottom:.75rem;transition:all .4s}
.side-red .side-icon{filter:drop-shadow(0 0 20px rgba(239,68,68,.6))}
.side-blue .side-icon{filter:drop-shadow(0 0 20px rgba(59,130,246,.6))}
.side-red:hover .side-icon{transform:scale(1.1);filter:drop-shadow(0 0 40px rgba(239,68,68,.8))}
.side-blue:hover .side-icon{transform:scale(1.1);filter:drop-shadow(0 0 40px rgba(59,130,246,.8))}

.side-label{display:block;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem;font-weight:700;opacity:.5;transition:opacity .4s}
.side:hover .side-label{opacity:.8}
.side-red .side-label{color:#fca5a5}
.side-blue .side-label{color:#93c5fd}

.side-name{display:block;font-size:1.6rem;font-weight:900;letter-spacing:.08em;transition:text-shadow .4s}
.side-red .side-name{color:#ef4444}
.side-blue .side-name{color:#3b82f6}
.side-red:hover .side-name{text-shadow:0 0 40px rgba(239,68,68,.8),0 0 80px rgba(239,68,68,.4)}
.side-blue:hover .side-name{text-shadow:0 0 40px rgba(59,130,246,.8),0 0 80px rgba(59,130,246,.4)}

.side-sub{display:block;font-size:.5rem;color:#3f3f46;letter-spacing:.06em;margin-top:.3rem;transition:color .4s}
.side:hover .side-sub{color:#71717a}

/* CENTER DIVIDER - Purple Lightning */
.divider{
  position:relative;width:6px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(to bottom,transparent,var(--purple),var(--purple),transparent);
  box-shadow:0 0 30px var(--purple-glow),0 0 60px rgba(168,85,247,.2);
  animation:dividerPulse 2.5s ease-in-out infinite;
}
@keyframes dividerPulse{0%,100%{box-shadow:0 0 30px var(--purple-glow),0 0 60px rgba(168,85,247,.2)}50%{box-shadow:0 0 50px var(--purple-glow),0 0 100px rgba(168,85,247,.35)}}

/* Lightning bolt */
.lightning{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:3px;overflow:visible}
.lightning svg{width:100%;height:100%}
.lightning-glow{position:absolute;inset:0;background:linear-gradient(to bottom,transparent,rgba(168,85,247,.3),rgba(255,255,255,.6),rgba(168,85,247,.3),transparent);filter:blur(15px);animation:lightningFlash 2s ease-in-out infinite}
@keyframes lightningFlash{0%,80%,100%{opacity:.3}45%{opacity:.8}48%{opacity:.2}50%{opacity:1}52%{opacity:.3}}

/* Choice text on divider */
.choice-text{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  writing-mode:vertical-rl;text-orientation:mixed;
  font-size:.45rem;letter-spacing:.25em;text-transform:uppercase;
  color:rgba(168,85,247,.6);font-weight:700;z-index:2;
  animation:choicePulse 3s ease-in-out infinite;
}
@keyframes choicePulse{0%,100%{color:rgba(168,85,247,.4)}50%{color:rgba(255,255,255,.6)}}

/* Particle effects on each side */
.side-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;border-radius:50%;animation:spDrift var(--dur) ease-in-out infinite;animation-delay:var(--del)}
.side-red .sp{background:rgba(239,68,68,.5);width:2px;height:2px}
.side-blue .sp{background:rgba(59,130,246,.5);width:2px;height:2px}
@keyframes spDrift{0%{transform:translate(0,0);opacity:var(--op)}50%{transform:translate(var(--dx),var(--dy));opacity:.1}100%{transform:translate(0,0);opacity:var(--op)}}

/* Red dust motes rising */
.side-red::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 90%,rgba(239,68,68,.08),transparent 50%);
  animation:redMist 4s ease-in-out infinite alternate;}
@keyframes redMist{0%{opacity:.3}100%{opacity:.7}}

/* Blue mist settling */
.side-blue::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 10%,rgba(59,130,246,.08),transparent 50%);
  animation:blueMist 4s ease-in-out infinite alternate;}
@keyframes blueMist{0%{opacity:.3}100%{opacity:.7}}

/* Entrance */
.side{opacity:0;transform:translateX(var(--entry-x,0))}
.side-red{--entry-x:-40px;animation:slideIn .8s cubic-bezier(.16,1,.3,1) .2s forwards}
.side-blue{--entry-x:40px;animation:slideIn .8s cubic-bezier(.16,1,.3,1) .4s forwards}
.divider{animation:dividerIn .6s cubic-bezier(.16,1,.3,1) .5s both,dividerPulse 2.5s ease-in-out 1s infinite}
@keyframes slideIn{to{opacity:1;transform:translateX(0)}}
@keyframes dividerIn{from{opacity:0;transform:scaleY(.5)}to{opacity:1;transform:scaleY(1)}}

/* Responsive */
@media(max-width:768px){
  .side-icon{font-size:2rem}
  .side-name{font-size:1rem}
  .side-label{font-size:.45rem}
  .side-sub{font-size:.4rem}
  .choice-text{font-size:.35rem}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="stage">

  <!-- RED SIDE -->
  <a href="/fire" class="side side-red">
    <div class="side-glow"></div>
    <div class="side-particles" data-el="red"></div>
    <div class="side-content">
      <span class="side-icon">&#x1F525;</span>
      <span class="side-label">Choose the self</span>
      <span class="side-name">ABOUT</span>
      <span class="side-sub">Who I am · Leo · The fire within</span>
    </div>
  </a>

  <!-- DIVIDER -->
  <div class="divider">
    <div class="lightning-glow"></div>
    <span class="choice-text">choose</span>
  </div>

  <!-- BLUE SIDE -->
  <a href="/water" class="side side-blue">
    <div class="side-glow"></div>
    <div class="side-particles" data-el="blue"></div>
    <div class="side-content">
      <span class="side-icon">&#x2694;</span>
      <span class="side-label">Choose the work</span>
      <span class="side-name">CREATE</span>
      <span class="side-sub">What I build · Tools · The output</span>
    </div>
  </a>

</div>

<script>
// Space background
(function(){
  var c=document.getElementById('bg'),ctx=c.getContext('2d'),w,h;
  function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  R();window.addEventListener('resize',R);

  var stars=[];
  for(var i=0;i<200;i++)stars.push({
    x:Math.random()*w,y:Math.random()*h,r:Math.random()*1+.2,
    o:Math.random()*.5+.15,pulse:Math.random()*Math.PI*2,depth:.1+Math.random()*.4
  });

  function D(t){
    ctx.clearRect(0,0,w,h);
    stars.forEach(function(s){
      s.o+=.003*Math.sin(t*.002+s.pulse);s.o=Math.max(.1,Math.min(.8,s.o));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+s.o+')';ctx.fill();
    });
    // Constellation lines
    for(var i=0;i<stars.length;i+=10){
      for(var j=i+5;j<stars.length;j+=8){
        var dx=stars[i].x-stars[j].x,dy=stars[i].y-stars[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<90){ctx.beginPath();ctx.moveTo(stars[i].x,stars[i].y);ctx.lineTo(stars[j].x,stars[j].y);
          ctx.strokeStyle='rgba(255,255,255,'+(.015*(1-d/90))+')';ctx.stroke();}
      }
    }
    requestAnimationFrame(D);
  }
  requestAnimationFrame(D);
})();

// Side particles
(function(){
  function gen(el,count,color,dir){
    var h='';
    for(var i=0;i<count;i++){
      h+='<div class="sp" style="left:'+(5+Math.random()*90)+'%;top:'+(5+Math.random()*90)+'%;'
        +'--dx:'+(dir*(10+Math.random()*30))+'px;--dy:'+((Math.random()-.5)*40)+'px;'
        +'--dur:'+(2+Math.random()*4)+'s;--del:'+(Math.random()*3)+'s;--op:'+(.2+Math.random()*.6)+'"></div>';
    }
    el.innerHTML=h;
  }
  gen(document.querySelector('[data-el="red"]'),35,'#ef4444',1);
  gen(document.querySelector('[data-el="blue"]'),35,'#3b82f6',-1);
})();
</script>

</body>
</html>
