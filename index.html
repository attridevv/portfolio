<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
:root{
  --bg:#010104;
  --fire:#f97316;--fire2:#ef4444;--fire3:#fbbf24;
  --water:#38bdf8;--water2:#06b6d4;--water3:#818cf8;
  --ice:#e0f2fe;--ice2:#bae6fd;--ice3:#94a3b8;
  --thunder:#facc15;--thunder2:#eab308;--thunder3:#fef08a;
  --void:#a78bfa;--void2:#8b5cf6;--void3:#c4b5fd;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:#e2e8f0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
  height:100vh;width:100vw;
  cursor:crosshair;
}

canvas#stars{position:fixed;inset:0;z-index:0}
canvas#nebula{position:fixed;inset:0;z-index:1;pointer-events:none}
canvas#trails{position:fixed;inset:0;z-index:2;pointer-events:none}

.main-layer{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none}
.main-layer>*{pointer-events:auto}

.realms{
  display:flex;flex-wrap:wrap;
  gap:clamp(2rem,5vw,3.5rem);
  justify-content:center;align-items:center;
  padding:3rem;
  max-width:1200px;
  perspective:1200px;
}

.world{
  position:relative;
  width:clamp(140px,18vw,190px);
  height:clamp(140px,18vw,190px);
  cursor:pointer;
  text-decoration:none;
  transition:transform .6s cubic-bezier(.16,1,.3,1);
  transform-style:preserve-3d;
}
.world:hover{transform:scale(1.18) translateY(-8px);z-index:20}

.world-orbit{
  position:absolute;inset:-20px;
  border-radius:50%;
  border:1px solid transparent;
  animation:orbit 18s linear infinite;
  transition:all .6s;
}
.world-orbit:nth-child(2){inset:-35px;animation-duration:25s;animation-direction:reverse}
.world-orbit:nth-child(3){inset:-10px;animation-duration:12s;border-style:dashed}
.world:hover .world-orbit{border-color:rgba(255,255,255,.12)}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.world-glow{
  position:absolute;inset:-30px;
  border-radius:50%;
  filter:blur(40px);
  opacity:.15;
  transition:all .8s;
  pointer-events:none;
}
.fire .world-glow{background:radial-gradient(circle,var(--fire),transparent)}
.water .world-glow{background:radial-gradient(circle,var(--water),transparent)}
.ice .world-glow{background:radial-gradient(circle,var(--ice),transparent)}
.thunder .world-glow{background:radial-gradient(circle,var(--thunder),transparent)}
.void .world-glow{background:radial-gradient(circle,var(--void),transparent)}
.world:hover .world-glow{opacity:.35;inset:-50px;filter:blur(50px)}

.world-core{
  position:absolute;inset:12%;
  border-radius:50%;
  overflow:hidden;
  transition:all .5s;
}
.world:hover .world-core{inset:8%;box-shadow:0 0 100px rgba(255,255,255,.08),inset 0 0 60px rgba(255,255,255,.04)}

.fire .world-core{background:radial-gradient(circle at 45% 40%,#fbbf24,#f97316 30%,#c2410c 55%,#431407)}
.fire .world-core::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 60% 30%,rgba(255,255,255,.15),transparent 50%);
  animation:firePulse 2.5s ease-in-out infinite alternate;}
@keyframes firePulse{0%{opacity:.3;transform:scale(1)}100%{opacity:.7;transform:scale(1.05)}}

.water .world-core{background:radial-gradient(circle at 40% 35%,#bae6fd,#38bdf8 30%,#0ea5e9 55%,#0c4a6e)}
.water .world-core::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 70% 25%,rgba(255,255,255,.2),transparent 45%);
  animation:waterFlow 3s ease-in-out infinite;}
@keyframes waterFlow{0%,100%{transform:translateX(-3%)scale(1.02)}50%{transform:translateX(4%)scale(.98)}}

.ice .world-core{background:radial-gradient(circle at 45% 35%,#f0f9ff,#bae6fd 25%,#7dd3fc 50%,#475569)}
.ice .world-core::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.25),transparent 40%);
  animation:iceShimmer 3.5s ease-in-out infinite alternate;}
@keyframes iceShimmer{0%{opacity:.35;filter:brightness(1)}100%{opacity:.7;filter:brightness(1.15)}}

.thunder .world-core{background:radial-gradient(circle at 40% 30%,#fef08a,#eab308 30%,#a16207 55%,#422006)}
.thunder .world-core::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.08),transparent 20%,transparent 70%,rgba(255,255,255,.05),transparent);
  animation:thunderSpin 5s linear infinite;}
@keyframes thunderSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.void .world-core{background:radial-gradient(circle at 45% 35%,#c4b5fd,#8b5cf6 30%,#5b21b6 55%,#1e1b4b)}
.void .world-core::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 45% 45%,rgba(255,255,255,.04) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(167,139,250,.2),transparent 70%);
  animation:voidPulse 4s ease-in-out infinite;}
@keyframes voidPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.04)}}

/* Labels */
.world-label{
  position:absolute;bottom:-4rem;left:50%;transform:translateX(-50%);
  text-align:center;transition:transform .5s;
}
.world:hover .world-label{transform:translateX(-50%)translateY(-6px)}
.world-label .num{font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:.25rem}
.fire .num{color:#fb923c}.water .num{color:#38bdf8}.ice .num{color:#bae6fd}
.thunder .num{color:#facc15}.void .num{color:#a78bfa}

.world-label .name{font-size:1.2rem;font-weight:900;letter-spacing:.1em;display:block;transition:text-shadow .5s}
.fire .name{color:#ea580c}.water .name{color:#0ea5e9}.ice .name{color:#e0f2fe}
.thunder .name{color:#eab308}.void .name{color:#7c3aed}
.world:hover .name{text-shadow:0 0 40px currentColor}

.world-label .sub{font-size:.52rem;color:#3f3f46;letter-spacing:.06em;display:block;margin-top:.2rem;transition:color .5s}
.world:hover .sub{color:#71717a}

/* Entrance sequence */
.realms .world{opacity:0;transform:translateY(30px)scale(.9)}
.realms.ready .world{animation:worldEnter .8s cubic-bezier(.16,1,.3,1) forwards}
.realms.ready .world:nth-child(1){animation-delay:.3s}
.realms.ready .world:nth-child(2){animation-delay:.5s}
.realms.ready .world:nth-child(3){animation-delay:.7s}
.realms.ready .world:nth-child(4){animation-delay:.9s}
.realms.ready .world:nth-child(5){animation-delay:1.1s}
@keyframes worldEnter{to{opacity:1;transform:translateY(0)scale(1)}}

/* Mouse particles */
.mouse-trail{position:fixed;pointer-events:none;z-index:5}
.mt-dot{position:absolute;border-radius:50%;animation:mtFade .6s ease-out forwards}
@keyframes mtFade{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(0)}}

/* Responsive */
@media(max-width:700px){
  .realms{gap:1.5rem;padding:1.5rem}
  .world{width:120px;height:120px}
  .world-orbit{inset:-14px}.world-orbit:nth-child(2){inset:-22px}.world-orbit:nth-child(3){inset:-6px}
  .world-label{bottom:-3rem}
  .world-label .name{font-size:.9rem}
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="nebula"></canvas>
<canvas id="trails"></canvas>

<div class="main-layer">
<div class="realms" id="realms">

  <a href="/fire" class="world fire">
    <div class="world-orbit"></div><div class="world-orbit"></div><div class="world-orbit"></div>
    <div class="world-glow"></div>
    <div class="world-core"></div>
    <div class="world-label">
      <span class="num">Realm I</span>
      <span class="name">Fire</span>
      <span class="sub">Leo · About Me</span>
    </div>
  </a>

  <a href="/water" class="world water">
    <div class="world-orbit"></div><div class="world-orbit"></div><div class="world-orbit"></div>
    <div class="world-glow"></div>
    <div class="world-core"></div>
    <div class="world-label">
      <span class="num">Realm II</span>
      <span class="name">Water</span>
      <span class="sub">Tools · My Work</span>
    </div>
  </a>

  <a href="/ice" class="world ice">
    <div class="world-orbit"></div><div class="world-orbit"></div><div class="world-orbit"></div>
    <div class="world-glow"></div>
    <div class="world-core"></div>
    <div class="world-label">
      <span class="num">Realm III</span>
      <span class="name">Ice</span>
      <span class="sub">Creativity · Vent</span>
    </div>
  </a>

  <a href="/lightning" class="world thunder">
    <div class="world-orbit"></div><div class="world-orbit"></div><div class="world-orbit"></div>
    <div class="world-glow"></div>
    <div class="world-core"></div>
    <div class="world-label">
      <span class="num">Realm IV</span>
      <span class="name">Thunder</span>
      <span class="sub">Goals · Ambition</span>
    </div>
  </a>

  <a href="/darkness" class="world void">
    <div class="world-orbit"></div><div class="world-orbit"></div><div class="world-orbit"></div>
    <div class="world-glow"></div>
    <div class="world-core"></div>
    <div class="world-label">
      <span class="num">Realm V</span>
      <span class="name">Void</span>
      <span class="sub">Admiration · Thanks</span>
    </div>
  </a>

</div>
</div>

<script>
(function(){
  var SC = document.getElementById('stars');
  var NC = document.getElementById('nebula');
  var TC = document.getElementById('trails');
  var Sctx = SC.getContext('2d');
  var Nctx = NC.getContext('2d');
  var Tctx = TC.getContext('2d');

  var W,H,mx=0,my=0,mouse={x:0,y:0};

  function resize(){
    W=SC.width=NC.width=TC.width=window.innerWidth;
    H=SC.height=NC.height=TC.height=window.innerHeight;
    mx=W/2;my=H/2;
  }
  resize();
  window.addEventListener('resize',resize);

  // Mouse tracking + parallax shift
  document.addEventListener('mousemove',function(e){
    var dx=e.clientX-mx,dy=e.clientY-my;
    mx+=(e.clientX-mx)*.08;my+=(e.clientY-my)*.08;
    mouse.x=e.clientX/W;mouse.y=e.clientY/H;
  });
  document.addEventListener('touchmove',function(e){
    mouse.x=e.touches[0].clientX/W;mouse.y=e.touches[0].clientY/H;
  },{passive:true});

  // === LAYER 1: Deep background stars ===
  var bgStars=[];
  for(var i=0;i<300;i++){
    bgStars.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*.8+.1,
      o:Math.random()*.5+.15,
      pulse:Math.random()*Math.PI*2,
      depth:.1+Math.random()*.3
    });
  }

  // === LAYER 2: Nebula clouds ===
  var nebulas=[];
  for(var i=0;i<5;i++){
    nebulas.push({
      x:Math.random()*W,y:Math.random()*H,
      r:150+Math.random()*300,
      hue:Math.random()>.5?Math.random()*60+200:Math.random()*60,
      o:Math.random()*.03+.02,
      vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,
      pulse:Math.random()*Math.PI*2
    });
  }

  // === LAYER 3: Trail particles (constellation lines between worlds) ===
  var trails=[];
  for(var i=0;i<80;i++){
    trails.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
      r:Math.random()*1.2+.2,o:Math.random()*.4+.1,
      life:Math.random()*200
    });
  }

  // Mouse particle buffer
  var mouseTrails=[];

  function draw(t){
    var px=mouse.x,py=mouse.y;

    // LAYER 1: Background stars
    Sctx.clearRect(0,0,W,H);
    bgStars.forEach(function(s){
      s.y+=s.depth*.1;
      if(s.y>H)s.y=0;
      s.x+=(px-.5)*s.depth*10;
      if(s.x<0)s.x=W;if(s.x>W)s.x=0;

      var o=s.o+.1*Math.sin(t*.002+s.pulse);
      Sctx.beginPath();Sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      Sctx.fillStyle='rgba(255,255,255,'+o+')';Sctx.fill();
    });
    // Connect nearby stars
    for(var i=0;i<bgStars.length;i+=8){
      for(var j=i+4;j<bgStars.length;j+=6){
        var dx=bgStars[i].x-bgStars[j].x,dy=bgStars[i].y-bgStars[j].y;
        var d=Math.sqrt(dx*dx+dy*dy);
        if(d<80){
          Sctx.beginPath();Sctx.moveTo(bgStars[i].x,bgStars[i].y);Sctx.lineTo(bgStars[j].x,bgStars[j].y);
          Sctx.strokeStyle='rgba(255,255,255,'+(.02*(1-d/80))+')';Sctx.stroke();
        }
      }
    }

    // LAYER 2: Nebula clouds
    Nctx.clearRect(0,0,W,H);
    nebulas.forEach(function(n){
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<-n.r)n.x=W+n.r;if(n.x>W+n.r)n.x=-n.r;
      if(n.y<-n.r)n.y=H+n.r;if(n.y>H+n.r)n.y=-n.r;
      n.o+=.0002*Math.sin(t*.0005+n.pulse);
      n.o=Math.max(.01,Math.min(.05,n.o));

      var g=Nctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      g.addColorStop(0,'hsla('+n.hue+',60%,60%,'+n.o+')');
      g.addColorStop(.5,'hsla('+n.hue+',40%,40%,'+(n.o*.5)+')');
      g.addColorStop(1,'transparent');
      Nctx.fillStyle=g;Nctx.beginPath();Nctx.arc(n.x,n.y,n.r,0,Math.PI*2);Nctx.fill();
    });

    // LAYER 3: Trail particles
    Tctx.clearRect(0,0,W,H);
    trails.forEach(function(t){
      t.x+=t.vx;t.y+=t.vy;
      if(t.x<0||t.x>W)t.vx*=-1;
      if(t.y<0||t.y>H)t.vy*=-1;
      t.life--;
      if(t.life<=0){t.x=Math.random()*W;t.y=Math.random()*H;t.life=200+Math.random()*200;}

      Tctx.beginPath();Tctx.arc(t.x,t.y,t.r,0,Math.PI*2);
      Tctx.fillStyle='rgba(200,220,255,'+t.o+')';Tctx.fill();
    });

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);

  // Entrance animation
  setTimeout(function(){document.getElementById('realms').classList.add('ready')},200);

})();
</script>
</body>
</html>
