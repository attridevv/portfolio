<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --pink:#ec4899;--pink-soft:#f9a8d4;--pink-glow:rgba(236,72,153,.15);
  --blue:#3b82f6;--blue-soft:#93c5fd;--blue-glow:rgba(59,130,246,.12);
  --gold:#fbbf24;
}

body{
  background:#0a0810;color:#e2e8f0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  width:100vw;height:100vh;overflow:hidden;
}

/* ===== LAYERS ===== */
.stars-canvas{position:fixed;inset:0;z-index:0}
.ground-mist{position:fixed;bottom:0;left:0;right:0;height:40%;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(10,8,16,.9),transparent);}
.ground-mist::before{content:'';position:absolute;left:0;bottom:0;width:45%;height:100%;
  background:radial-gradient(ellipse at 50% 100%,var(--pink-glow),transparent 70%);}
.ground-mist::after{content:'';position:absolute;right:0;bottom:0;width:45%;height:100%;
  background:radial-gradient(ellipse at 50% 100%,var(--blue-glow),transparent 70%);}

/* ===== SCENE ===== */
.scene{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scene>*{pointer-events:auto}

/* ===== FIGURES ===== */
.figure{position:absolute;bottom:22%;width:120px;height:200px;transition:all .6s}
.figure-left{left:22%}.figure-right{right:22%}

.figure-glow{position:absolute;inset:-40px;border-radius:50%;opacity:.5;transition:opacity .6s}
.figure-left .figure-glow{background:radial-gradient(ellipse at 50% 60%,var(--pink-glow),transparent 70%)}
.figure-right .figure-glow{background:radial-gradient(ellipse at 50% 60%,var(--blue-glow),transparent 70%)}

.figure-silhouette{position:relative;width:100%;height:100%}

/* ===== ZERO TWO silhouette ===== */
.zt-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:32px;background:rgba(236,72,153,.08);border-radius:50% 50% 45% 45%}
.zt-horns{position:absolute;top:-8px;left:50%;transform:translateX(-50%)}
.zt-horn{position:absolute;width:2px;height:18px;background:linear-gradient(to top,rgba(236,72,153,.4),rgba(236,72,153,.15));border-radius:1px}
.zt-horn-l{left:-8px;transform:rotate(-15deg)}.zt-horn-r{right:-8px;transform:rotate(15deg)}

.zt-body{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:34px;height:80px;background:rgba(236,72,153,.05);border-radius:12px 12px 8px 8px}
.zt-dress{position:absolute;top:90px;left:50%;transform:translateX(-50%);width:50px;height:70px;background:rgba(236,72,153,.04);border-radius:50% 50% 10% 10%}

.zt-arm-l{position:absolute;top:38px;left:14px;width:2px;height:45px;background:rgba(236,72,153,.12);border-radius:1px;transform:rotate(15deg)}
.zt-arm-r{position:absolute;top:38px;right:14px;width:2px;height:45px;background:rgba(236,72,153,.12);border-radius:1px;transform:rotate(-15deg)}

/* ===== HIRO silhouette ===== */
.h-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:32px;background:rgba(59,130,246,.08);border-radius:50% 50% 45% 45%}

.h-body{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:36px;height:90px;background:rgba(59,130,246,.05);border-radius:10px 10px 6px 6px}
.h-collar{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:38px;height:6px;background:rgba(59,130,246,.08);border-radius:2px}

.h-arm-l{position:absolute;top:38px;left:14px;width:2px;height:48px;background:rgba(59,130,246,.12);border-radius:1px;transform:rotate(12deg)}
.h-arm-r{position:absolute;top:38px;right:14px;width:2px;height:48px;background:rgba(59,130,246,.12);border-radius:1px;transform:rotate(-12deg)}

/* ===== RED THREAD OF FATE ===== */
.thread-container{position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;pointer-events:none}
.thread-glow{animation:threadPulse 3s ease-in-out infinite}
@keyframes threadPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ===== PETALS ===== */
.petals-layer{position:fixed;inset:0;z-index:8;pointer-events:none}
.petal{position:absolute;width:6px;height:10px;background:radial-gradient(ellipse at 30% 30%,var(--pink-soft),rgba(236,72,153,.4));border-radius:50% 0 50% 0;opacity:0;
  animation:petalDrift var(--dur) ease-in-out infinite;animation-delay:var(--del);left:var(--x)}
@keyframes petalDrift{0%{opacity:.7;transform:translate(0,0)rotate(0deg)}25%{transform:translate(var(--drift),25vh)rotate(90deg)}50%{opacity:.5;transform:translate(calc(var(--drift)*-.4),50vh)rotate(180deg)}75%{transform:translate(calc(var(--drift)*.2),75vh)rotate(270deg)}100%{opacity:0;transform:translate(var(--drift),100vh)rotate(360deg)}}

/* ===== OVERLAY ===== */
.overlay{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex}
.choice{flex:1;cursor:pointer;pointer-events:auto;position:relative;text-decoration:none;transition:background .6s}
.choice:hover .choice-hint{opacity:1;transform:translateX(-50%)translateY(-6px)}
.choice-l:hover{background:radial-gradient(ellipse at 20% 55%,rgba(236,72,153,.03),transparent 55%)}
.choice-r:hover{background:radial-gradient(ellipse at 80% 55%,rgba(59,130,246,.03),transparent 55%)}

.choice-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:all .6s}
.choice-l .choice-hint{color:var(--pink-soft)}.choice-r .choice-hint{color:var(--blue-soft)}
.choice-hint .l1{display:block;font-size:.45rem;letter-spacing:.28em;text-transform:uppercase;font-weight:800;margin-bottom:.08rem;opacity:.6}
.choice-hint .l2{display:block;font-size:.75rem;font-weight:900;letter-spacing:.06em}
.choice-hint .l3{display:block;font-size:.34rem;letter-spacing:.16em;margin-top:.08rem;opacity:.3}

/* ===== PARTICLES AROUND FIGURES ===== */
.spark{position:absolute;border-radius:50%;pointer-events:none;animation:sparkFloat var(--d) ease-in-out infinite;animation-delay:var(--del);opacity:0}
@keyframes sparkFloat{0%{opacity:.6;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--sx),var(--sy))}}
.pink-spark{background:var(--pink-soft);width:2px;height:2px}
.blue-spark{background:var(--blue-soft);width:2px;height:2px}

@media(max-width:768px){
  .figure{width:80px;height:150px;bottom:25%}
  .figure-left{left:10%}.figure-right{right:10%}
  .zt-head,.h-head{width:22px;height:26px}
  .zt-body{width:26px;height:60px;top:24px}
  .zt-dress{width:38px;height:55px;top:70px}
  .h-body{width:28px;height:70px;top:24px}
}
</style>
</head>
<body>

<canvas id="stars-canvas" class="stars-canvas"></canvas>
<div class="ground-mist"></div>

<!-- THREAD OF FATE -->
<div class="thread-container">
  <svg width="100%" height="100%" style="position:absolute;inset:0">
    <defs>
      <filter id="threadGlow"><feGaussianBlur stdDeviation="3"/></filter>
      <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
        <stop offset="25%" stop-color="#ec4899" stop-opacity=".7"/>
        <stop offset="50%" stop-color="#fbbf24" stop-opacity=".9"/>
        <stop offset="75%" stop-color="#3b82f6" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- Main thread -->
    <path d="M0,200 Q200,120 400,100 Q600,80 800,140 Q1000,200 1200,180" 
          stroke="url(#threadGrad)" stroke-width="1.5" fill="none" filter="url(#threadGlow)" class="thread-glow"/>
    <!-- Secondary thread (loose, wrapping) -->
    <path d="M0,220 Q250,160 450,180 Q650,200 850,150 Q1050,100 1200,170" 
          stroke="url(#threadGrad)" stroke-width=".8" fill="none" opacity=".4" class="thread-glow" style="animation-delay:.8s"/>
    <!-- Third delicate thread -->
    <path d="M0,180 Q180,90 380,80 Q580,70 780,110 Q980,150 1200,160" 
          stroke="url(#threadGrad)" stroke-width=".6" fill="none" opacity=".3" class="thread-glow" style="animation-delay:1.5s"/>
  </svg>
</div>

<!-- SCENE -->
<div class="scene">

  <!-- ZERO TWO (left) -->
  <div class="figure figure-left">
    <div class="figure-glow"></div>
    <div class="figure-silhouette">
      <div class="zt-head"><div class="zt-horns"><div class="zt-horn zt-horn-l"></div><div class="zt-horn zt-horn-r"></div></div></div>
      <div class="zt-body"></div>
      <div class="zt-arm-l"></div><div class="zt-arm-r"></div>
      <div class="zt-dress"></div>
    </div>
  </div>

  <!-- HIRO (right) -->
  <div class="figure figure-right">
    <div class="figure-glow"></div>
    <div class="figure-silhouette">
      <div class="h-head"></div>
      <div class="h-body"><div class="h-collar"></div></div>
      <div class="h-arm-l"></div><div class="h-arm-r"></div>
    </div>
  </div>

</div>

<!-- PETALS -->
<div class="petals-layer" id="petals"></div>

<!-- SPARKS -->
<div class="petals-layer" id="sparks"></div>

<div class="overlay">
  <a href="/fire" class="choice choice-l">
    <div class="choice-hint"><span class="l1">The Self</span><span class="l2">ABOUT</span><span class="l3">Leo · Identity · Fire</span></div>
  </a>
  <a href="/water" class="choice choice-r">
    <div class="choice-hint"><span class="l1">The Work</span><span class="l2">CREATE</span><span class="l3">Tools · Builds · Output</span></div>
  </a>
</div>

<script>
// Stars
(function(){
var c=document.getElementById('stars-canvas'),ctx=c.getContext('2d'),w,h;
function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
R();window.addEventListener('resize',R);
var stars=[];
for(var i=0;i<60;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*.6+.08,o:Math.random()*.25+.05,p:Math.random()*Math.PI*2});
(function D(t){
if(w!==c.width||h!==c.height)R();
ctx.clearRect(0,0,w,h);
stars.forEach(function(s){var b=.4+.6*Math.sin(t*.0012+s.p);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(s.o*b)+')';ctx.fill()});
requestAnimationFrame(D);
})();
})();

// Cherry blossom petals
(function(){
var p=document.getElementById('petals'),h='';
for(var i=0;i<40;i++){
  var x=5+Math.random()*90,dur=7+Math.random()*12,del=Math.random()*14,drift=(Math.random()-.5)*250;
  h+='<div class="petal" style="--x:'+x+'%;--dur:'+dur+'s;--del:'+del+'s;--drift:'+drift+'px"></div>';
}
p.innerHTML=h;
})();

// Ambient sparks around figures
(function(){
var s=document.getElementById('sparks'),h='';
for(var i=0;i<20;i++){
  var l=15+Math.random()*25,sx=(Math.random()-.5)*40,sy=-10-Math.random()*30,d=2+Math.random()*3,del=Math.random()*3;
  h+='<div class="spark pink-spark" style="left:'+l+'%;bottom:35%;--sx:'+sx+'px;--sy:'+sy+'px;--d:'+d+'s;--del:'+del+'s"></div>';
}
for(var i=0;i<20;i++){
  var l=65+Math.random()*25,sx=(Math.random()-.5)*40,sy=-10-Math.random()*30,d=2+Math.random()*3,del=Math.random()*3;
  h+='<div class="spark blue-spark" style="left:'+l+'%;bottom:35%;--sx:'+sx+'px;--sy:'+sy+'px;--d:'+d+'s;--del:'+del+'s"></div>';
}
s.innerHTML=h;
})();
</script>
</body>
</html>
