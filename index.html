<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>attridevv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0a14;overflow:hidden;width:100vw;height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}

/* ===== SCENE ===== */
.scene{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}

/* ===== SAKURA TREE (center) ===== */
.tree{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:50%;height:80%;z-index:5}
.tree-svg{width:100%;height:100%}

/* ===== ZERO TWO (left, red) ===== */
.zero-two{position:absolute;bottom:0;left:5%;width:35%;height:70%;z-index:4}
.zero-two .aura{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(236,72,153,.12),transparent 65%);animation:ztAura 3s ease-in-out infinite alternate}
@keyframes ztAura{0%{opacity:.5}100%{opacity:1}}

.zt-body{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);width:50%;height:85%}
.zt-svg{width:100%;height:100%}

/* ===== HIRO (right, blue) ===== */
.hiro{position:absolute;bottom:0;right:5%;width:35%;height:70%;z-index:4}
.hiro .aura{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(59,130,246,.1),transparent 65%);animation:hiroAura 3.5s ease-in-out infinite alternate}
@keyframes hiroAura{0%{opacity:.5}100%{opacity:1}}

.hiro-body{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);width:50%;height:85%}
.hiro-svg{width:100%;height:100%}

/* ===== FALLING PETALS ===== */
.petals{position:fixed;inset:0;z-index:6;pointer-events:none}
.petal{position:absolute;width:8px;height:12px;background:radial-gradient(ellipse at 30% 30%,#fbcfe8,#f9a8d4);border-radius:50% 0 50% 0;opacity:0;animation:petalFall var(--dur) ease-in infinite;animation-delay:var(--del);left:var(--x)}
@keyframes petalFall{0%{opacity:.8;transform:translate(0,0)rotate(0deg)}25%{transform:translate(var(--drift),25vh)rotate(90deg)}50%{transform:translate(calc(var(--drift)*-.5),50vh)rotate(180deg)}75%{transform:translate(calc(var(--drift)*.3),75vh)rotate(270deg)}100%{opacity:0;transform:translate(var(--drift),100vh)rotate(360deg)}}

/* ===== GROUND MIST ===== */
.mist{position:absolute;bottom:0;left:0;right:0;height:30%;z-index:3;pointer-events:none}
.mist-l{position:absolute;left:0;bottom:0;width:40%;height:100%;background:linear-gradient(to top,rgba(236,72,153,.06),transparent)}
.mist-r{position:absolute;right:0;bottom:0;width:40%;height:100%;background:linear-gradient(to top,rgba(59,130,246,.06),transparent)}

/* ===== OVERLAY ===== */
.overlay{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex}
.choice{flex:1;cursor:pointer;pointer-events:auto;position:relative;text-decoration:none;transition:background .5s}
.choice-l:hover{background:radial-gradient(ellipse at 25% 60%,rgba(236,72,153,.04),transparent 60%)}
.choice-r:hover{background:radial-gradient(ellipse at 75% 60%,rgba(59,130,246,.04),transparent 60%)}
.choice:hover .choice-hint{opacity:1;transform:translateX(-50%)translateY(-6px)}

.choice-hint{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:all .5s}
.choice-l .choice-hint{color:#f9a8d4}.choice-r .choice-hint{color:#93c5fd}
.choice-hint .c1{display:block;font-size:.48rem;letter-spacing:.25em;text-transform:uppercase;font-weight:800;margin-bottom:.1rem}
.choice-hint .c2{display:block;font-size:.8rem;font-weight:900;letter-spacing:.06em}
.choice-hint .c3{display:block;font-size:.35rem;letter-spacing:.14em;margin-top:.1rem;opacity:.35}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="scene">

    </div>

    <div class="hiro-body">

        <defs>

        </defs>

        <!-- Uniform line -->

        <!-- Neck -->
        <rect x="93" y="205" width="14" height="18" rx="3" fill="#050a15"/>

        <!-- Head -->
        <ellipse cx="100" cy="195" rx="18" ry="20" fill="#050d1a" stroke="rgba(59,130,246,.25)" stroke-width=".8"/>
        <ellipse cx="100" cy="197" rx="13" ry="15" fill="rgba(59,130,246,.05)"/>
        <!-- Eyes -->
        <ellipse cx="94" cy="193" rx="2.2" ry="1.8" fill="#38bdf8"/>
        <ellipse cx="106" cy="193" rx="2.2" ry="1.8" fill="#38bdf8"/>
        <!-- Mouth -->
        <path d="M96 200 Q100 202 104 200" fill="none" stroke="rgba(59,130,246,.2)" stroke-width=".5"/>

        <!-- DARK BLUE HAIR -->
        <path d="M82 185 Q78 165 75 150 Q82 155 88 168 Q92 140 98 155 Q102 135 108 155 Q112 140 118 168 Q125 155 125 150 Q122 165 118 185 Q114 178 110 185 Q106 178 100 184 Q94 178 90 185 Q86 178 82 185 Z" fill="#030712" stroke="rgba(59,130,246,.25)" stroke-width=".7"/>
        <!-- Side hair -->
        <path d="M82 185 Q78 205 80 215 Q82 208 85 198 Q84 192 83 186 Z" fill="#030712" stroke="rgba(59,130,246,.15)" stroke-width=".4"/>
        <path d="M118 185 Q122 205 120 215 Q118 208 115 198 Q116 192 117 186 Z" fill="#030712" stroke="rgba(59,130,246,.15)" stroke-width=".4"/>
      </svg>
    </div>
  </div>

  <!-- SAKURA TREE (center) -->

    <svg class="tree-svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax meet">
      <defs>
        <radialGradient id="sakuraBloom" cx="50%" cy="50%"><stop offset="0%" stop-color="#fce7f3"/><stop offset="40%" stop-color="#f9a8d4"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".6"/></radialGradient>
        <radialGradient id="sakuraBloom2" cx="50%" cy="50%"><stop offset="0%" stop-color="#fdf2f8"/><stop offset="35%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#db2777" stop-opacity=".5"/></radialGradient>
        <filter id="treeGlow"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>

      <!-- Trunk glow -->
      <path d="M195 480 Q190 350 185 250 Q180 180 190 130 Q195 100 200 80" stroke="rgba(236,72,153,.12)" stroke-width="40" fill="none" filter="url(#treeGlow)"/>

      <!-- Main trunk -->

      <!-- Trunk texture lines -->

      <path d="M208 400 Q212 300 210 200" fill="none" stroke="#4a2040" stroke-width="1" opacity=".4"/>

      <!-- Major branches -->
      <!-- Left branch -->

      <!-- Right branch -->

      <path d="M315 130 Q320 128 325 130" stroke="#2d1a2a" stroke-width="6" fill="none"/>
      <!-- Right sub-branch -->
      <path d="M245 175 Q270 160 290 170" stroke="#2d1a2a" stroke-width="7" fill="none"/>

      <!-- Top branches -->
      <path d="M195 150 Q190 120 185 100" stroke="#2d1a2a" stroke-width="8" fill="none"/>
      <path d="M205 140 Q215 110 220 90" stroke="#2d1a2a" stroke-width="8" fill="none"/>

      <!-- Middle branch left -->

      <!-- Middle branch right -->
      <path d="M212 280 Q245 260 270 265" stroke="#2d1a2a" stroke-width="8" fill="none" stroke-linecap="round"/>

      <path d="M210 490 Q230 500 255 505" stroke="#2d1a2a" stroke-width="6" fill="none"/>

      <circle cx="175" cy="110" r="25" fill="url(#sakuraBloom2)" opacity=".8"/>

      <!-- Left cluster -->

      <circle cx="120" cy="160" r="22" fill="url(#sakuraBloom)" opacity=".75"/>

      <circle cx="100" cy="150" r="18" fill="url(#sakuraBloom)" opacity=".65"/>

      <!-- Right cluster -->

      <circle cx="245" cy="130" r="12" fill="url(#sakuraBloom2)" opacity=".6"/>
      <circle cx="185" cy="140" r="14" fill="url(#sakuraBloom2)" opacity=".65"/>
      <circle cx="215" cy="140" r="14" fill="url(#sakuraBloom)" opacity=".65"/>

      <!-- Branch ending blooms -->

      <circle cx="325" cy="128" r="15" fill="url(#sakuraBloom2)" opacity=".6"/>

      <!-- Particle dots within blooms -->

</div>

<!-- FALLING PETALS -->
<div class="petals" id="petals"></div>

<div class="overlay">
  <a href="/fire" class="choice choice-l">
    <div class="choice-hint"><span class="c1">The Self</span><span class="c2">ABOUT</span><span class="c3">Leo · Identity · Fire</span></div>
  </a>
  <a href="/water" class="choice choice-r">
    <div class="choice-hint"><span class="c1">The Work</span><span class="c2">CREATE</span><span class="c3">Tools · Builds · Output</span></div>
  </a>
</div>

<script>
// Stars
(function(){
var c=document.getElementById('stars'),ctx=c.getContext('2d'),w,h;
function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
R();window.addEventListener('resize',R);
var stars=[];
for(var i=0;i<80;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*.7+.1,o:Math.random()*.3+.08,p:Math.random()*Math.PI*2});
(function D(t){
if(w!==c.width||h!==c.height)R();
ctx.clearRect(0,0,w,h);
stars.forEach(function(s){var b=.5+.5*Math.sin(t*.0015+s.p);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(s.o*b)+')';ctx.fill()});
requestAnimationFrame(D);
})();
})();

// Falling petals
(function(){
var p=document.getElementById('petals'),h='';
for(var i=0;i<35;i++){
  var x=10+Math.random()*80;
  var dur=6+Math.random()*10;
  var del=Math.random()*12;
  var drift=(Math.random()-.5)*200;
  h+='<div class="petal" style="--x:'+x+'%;--dur:'+dur+'s;--del:'+del+'s;--drift:'+drift+'px"></div>';
}
p.innerHTML=h;
})();
</script>
</body>
